'geography|Human Geography: Nature and Scope':{p:['Human geography studies the relationship between humans and their physical environment, and the spatial distribution and variation of human activities. Geographers like Ratzel and Ellen Semple helped define it.','Fields: social geography, urban geography, economic geography, political geography, population and settlement geography, and others.','Environmental determinism: nature controls human life. Possibilism (Vidal de la Blache): nature provides possibilities and humans choose. Neo-determinism (Griffith Taylor), also called stop and go determinism, is a middle path.','Ritter’s idea of the naturalisation of humans and humanisation of nature describes how people adapt to nature and then change it with technology.','Human geography is interdisciplinary and links with economics, sociology and history.'],q:['Explain environmental determinism and possibilism.','What is meant by neo-determinism?'],t:'Make a small table: school of thought, thinker, main idea. This is the most asked part.',m:['Human Geography',['Meaning',['Humans and environment','Spatial distribution']],['Fields',['Social','Urban','Economic','Political']],['Approaches',['Determinism','Possibilism','Neo-determinism']],['Thinkers',['Ratzel','Vidal de la Blache','Griffith Taylor']]]},
'geography|Mineral and Energy Resources':{p:['Minerals are classified as metallic (ferrous like iron ore and manganese; non-ferrous like copper and bauxite), non-metallic (mica, limestone) and energy minerals (coal, petroleum).','Iron ore is found in Odisha, Jharkhand, Chhattisgarh, Karnataka and Goa. Coal, mostly from the Gondwana fields, is in Jharkhand, Odisha and Chhattisgarh. Petroleum is found at Mumbai High, Gujarat and Assam.','Conventional energy: coal, petroleum, natural gas, hydroelectricity and nuclear power. Non-conventional: solar, wind, tidal, biogas and geothermal.','Mineral resources are non-renewable and unevenly distributed, so they must be conserved.','Conservation: recycling, use of substitutes, efficient use and moving to renewable sources.'],q:['Classify minerals with examples.','Why should we promote non-conventional energy?'],t:'Give the mineral, its main states and its use in one line each.',m:['Mineral and Energy Resources',['Minerals',['Metallic','Non-metallic','Energy minerals']],['Distribution',['Iron ore: Odisha, Jharkhand','Coal: Gondwana fields','Petroleum: Mumbai High']],['Energy',['Conventional','Non-conventional']],['Conservation',['Recycling','Substitutes','Renewables']]]},
'history|Through the Eyes of Travellers':{p:['Al-Biruni came from Uzbekistan and wrote the Kitab-ul-Hind in the eleventh century. He learned Sanskrit and described Indian society, caste and religion.','Ibn Battuta, from Morocco, visited in the fourteenth century and wrote the Rihla. Muhammad bin Tughluq made him a qazi in Delhi. He described cities, trade and the postal system.','Francois Bernier, a French physician, visited in the seventeenth century. He argued that the crown owned all land, which hurt agriculture, a view modern historians question.','Travellers’ accounts show what surprised them, so they also reveal their own backgrounds and biases.','Compare with local sources to avoid one-sided conclusions.'],q:['What did Al-Biruni write about caste?','Why did Bernier think land ownership affected India?'],t:'Name the traveller, century and home country, and mention the bias of the source.',m:['Through the Eyes of Travellers',['Al-Biruni',['Uzbekistan','Kitab-ul-Hind','Sanskrit']],['Ibn Battuta',['Morocco','Rihla','Qazi in Delhi']],['Bernier',['France','Crown owns land','Delhi as a camp town']],['Using sources',['Bias','Compare local texts']]]},
'history|An Imperial Capital: Vijayanagara':{p:['Vijayanagara was founded in 1336 by Harihara and Bukka. Its capital was at Hampi, on the Tungabhadra river.','Krishnadeva Raya (1509 to 1529) of the Tuluva dynasty was its greatest ruler. In 1565 the empire was defeated at Talikota by the Deccan Sultanates and the city was abandoned.','Buildings: the Virupaksha and Vitthala temples, the Mahanavami dibba, the Lotus Mahal and elephant stables. The city was divided into a sacred centre and a royal centre with strong fortifications.','Water supply used tanks and canals, such as the Kamalapuram tank.','Sources: ruins, inscriptions and travellers like Domingo Paes and Nuniz. Colin Mackenzie surveyed the site in 1800.'],q:['Describe the fortifications of Vijayanagara.','What was the importance of Krishnadeva Raya?'],t:'Draw a simple labelled sketch of the sacred and royal centres. Name rulers with dates.',m:['Vijayanagara',['Founding',['1336','Harihara and Bukka','Hampi']],['Rulers',['Krishnadeva Raya','Talikota 1565']],['Buildings',['Virupaksha temple','Vitthala temple','Mahanavami dibba']],['Sources',['Paes and Nuniz','Mackenzie 1800']]]},
'history|Colonialism and the Countryside':{p:['The Permanent Settlement of 1793 by Cornwallis fixed land revenue permanently on zamindars in Bengal. Zamindars who failed to pay lost their land, under the sunset law.','Many zamindars lost estates. Jotedars, rich peasants, grew powerful in villages.','The Paharias of the Rajmahal hills practised jhum cultivation, and the Santhals were settled by the British in the Damin-i-koh in 1832. The Santhal rebellion followed in 1855.','In the Deccan the ryotwari system was introduced. High revenue and moneylenders led to the Deccan riots of 1875.','Cotton boom during the American Civil War ended, and peasants fell into debt. Sources: revenue records, surveys and Deccan Riots Commission reports.'],q:['What was the Permanent Settlement and its effects?','Why did the Deccan riots break out?'],t:'Contrast Bengal (zamindari) with Deccan (ryotwari) and mention the effect on peasants.',m:['Colonialism and the Countryside',['Bengal',['Permanent Settlement 1793','Zamindars','Sunset law']],['Tribes',['Paharias','Santhals','Damin-i-koh 1832']],['Deccan',['Ryotwari','Moneylenders','Riots 1875']],['Sources',['Revenue records','Riots Commission']]]},
'economics|Rural Development':{p:['Rural development means improving the economic and social conditions of rural areas. Key issues: credit, marketing, diversification and employment.','Rural credit: from moneylenders (high interest) and institutional sources. NABARD was set up in 1982, and self-help groups (SHGs) provide microfinance.','Agricultural marketing: regulated markets, cooperative marketing, and government support like minimum support price. Operation Flood (1970) helped dairy cooperatives.','Diversification: moving to animal husbandry, fisheries, horticulture and non-farm jobs.','Organic farming reduces use of chemicals and protects the soil and health. It may have lower yields at first but better prices.'],q:['What are the problems of rural credit?','Why is diversification necessary?'],t:'Learn the roles of NABARD, SHGs and Operation Flood with one line each.',m:['Rural Development',['Credit',['Moneylenders','NABARD 1982','SHGs']],['Marketing',['Regulated markets','Cooperatives','Support price']],['Diversification',['Animal husbandry','Fisheries','Horticulture']],['Organic farming',['Fewer chemicals','Better prices']]]},
'economics|Environment and Sustainable Development':{p:['The environment gives resources, absorbs waste, supports life and gives aesthetic services. Problems arise when demand and waste exceed the carrying capacity.','Main problems: global warming, ozone depletion, pollution and loss of biodiversity.','Sustainable development means meeting the needs of the present without harming the ability of future generations to meet theirs.','Strategies: renewable energy such as solar and wind, LPG and CNG, mini-hydel plants, traditional knowledge and organic farming.','India’s measures include laws to control pollution, forest protection and promoting clean energy.'],q:['What are the functions of the environment?','Explain sustainable development with strategies.'],t:'Write the definition of sustainable development in your own words, then give three strategies with examples.',m:['Environment and Sustainable Development',['Functions',['Resources','Absorbs waste','Supports life']],['Problems',['Global warming','Ozone loss','Pollution']],['Sustainable development',['Present and future needs']],['Strategies',['Solar and wind','Organic farming','CNG and LPG']]]},
'english|On the Face of It':{p:['Author: Susan Hill, a play. Derry, a teenager, has half his face burnt by acid. He feels shut out by people and believes they judge him only by his face. He is also bitter and withdrawn.','Mr Lamb is an old man with a tin leg, who lives in a garden full of apples and plums. He greets Derry warmly, treating him as a person.','Mr Lamb says he never lets his disability stop him, and he warns that people fear what they do not understand. He invites Derry to the garden.','Derry’s mother is over-protective and he is torn between her fear and Mr Lamb’s encouragement. The play ends with him moving towards the garden, after Mr Lamb’s death, with a choice to face the world.','Themes: physical disability, self-pity vs acceptance, loneliness, human kindness, and the need to look beyond appearance.'],q:['What is Derry’s attitude to his face at first?','How does Mr Lamb help Derry?'],t:'Show the change in Derry from self-pity to willingness to face people, and mention the garden as a symbol of acceptance.',m:['On the Face of It',['Derry',['Burnt face','Lonely and bitter','Over-protected']],['Mr Lamb',['Tin leg','Garden','Kind and cheerful']],['Message',['Accept yourself','Look beyond looks']],['Themes',['Disability','Loneliness','Kindness']]]},
'english|Memories of Childhood':{p:['Two accounts of how children were treated unfairly. Part one: Zitkala-Sa, a Native American, describes her time in a boarding school. Part two: Bama, a Dalit writer from Tamil Nadu, describes caste discrimination.','Zitkala-Sa was shocked by the rules and the cutting of her long hair, which in her culture was only for cowards or mourners. She hid under a bed, but was dragged out and had her hair cut, feeling like a puppet.','She felt her individuality was lost. The school wanted to remove native culture, so this is cultural and racial discrimination.','Bama saw an elder from her community carry a packet of food by a string, without touching it, to a higher-caste landlord. Her brother explained that it was untouchability.','Her brother advised her to study hard and be the best in class to rise above insult. She worked hard and stood first. Themes: oppression, protest and education as a way to dignity.'],q:['What did the cutting of hair mean to Zitkala-Sa?','How did Bama respond to caste discrimination?'],t:'Compare the two parts: racial vs caste discrimination, and how both writers resisted.',m:['Memories of Childhood',['Zitkala-Sa',['Native American','Boarding school','Haircut']],['Bama',['Dalit girl','Elder carrying food','Untouchability']],['Response',['Protest','Hard study','Self-respect']],['Themes',['Discrimination','Dignity','Education']]]},
'english|Writing skills (notice, letter, article, report)':{p:['Notice: write the name of the issuing body, the word NOTICE, date, title, a short body (usually under 50 words) and the signature with designation. Use a box.','Formal invitation or reply: use the third person and passive voice, give the occasion, date, time, venue, and end with the host’s name. Keep it short.','Letter to the editor or formal letter: sender’s address, date, receiver, subject line, salutation, body in three short paragraphs, close and signature. State the problem, the cause and a solution.','Article: a catchy title, your name, an introduction, two or three body paragraphs, and a conclusion with a call to action. Use examples and facts.','Report: a title, a byline, place and date, then paragraphs in past tense and passive voice. Check your latest board format and word limit.'],q:['Write a notice for a school event.','Write a letter to the editor on a local problem.'],t:'Practise each format once a week, and always check the word limit and marking scheme in your sample paper.',m:['Writing Skills',['Notice',['Box','Date','Short body','Signature']],['Invitation',['Third person','Occasion, date, venue']],['Letter and article',['Subject and salutation','Title and byline','Conclusion']],['Report',['Title and byline','Past tense','Passive voice']]]},
'geography|Tertiary and Quaternary Activities':{p:['Tertiary activities provide services: trade, transport, communication and other services. Workers are called white-collar workers.','Trade can be wholesale or retail. Services include education, health, tourism, banking and administration.','Quaternary activities are based on knowledge: research and development, information processing and specialised services. Outsourcing and BPO are examples.','Quinary activities involve top decision makers in government and business, often called gold-collar workers.','The service sector grows with development and provides large employment.'],q:['Distinguish between tertiary and quaternary activities.','What is outsourcing and why is it important?'],t:'Use a four-row table of primary to quinary activities with collars and examples.',m:['Tertiary and Quaternary Activities',['Tertiary',['Trade','Transport','Services']],['Trade',['Wholesale','Retail']],['Quaternary',['Research','Information','Outsourcing']],['Quinary',['Top decisions','Gold-collar workers']]]},
'geography|Planning and Sustainable Development':{p:['Planning in India includes target area planning, such as the Command Area Development and the Hill Area Development programmes.','Bharmaur in Himachal Pradesh is a tribal area of the Gaddi people. Its Integrated Tribal Development Project (1974) improved roads, schools and health.','The Indira Gandhi Canal Command Area in Rajasthan brings Himalayan river water to the desert. Problems include waterlogging and salinity.','Sustainable development means progress that meets present needs without harming future generations. It needs sensible use of land, water and forests.','Measures: better irrigation methods, afforestation and pastures, and protecting local communities.'],q:['Explain the problems of the Indira Gandhi Canal Command Area.','What is sustainable development?'],t:'Write one case study with its problem, effect and remedy.',m:['Planning and Sustainable Development',['Planning',['Target area','Hill area','Command area']],['Bharmaur',['Gaddis','ITDP 1974','Roads and schools']],['Indira Gandhi Canal',['Desert irrigation','Waterlogging','Salinity']],['Sustainable',['Present and future needs','Afforestation']]]},
'geography|Manufacturing Industries':{p:['Manufacturing industries raise value of raw materials and provide jobs. India’s main industries are iron and steel, cotton textiles, sugar, petrochemicals, fertilisers, cement and information technology.','Iron and steel: the Tata plant at Jamshedpur started in 1907. Other plants are at Bhilai, Durgapur, Rourkela and Bokaro, many run by SAIL.','Cotton textile: Mumbai and Ahmedabad are old centres. Sugar is mainly in Uttar Pradesh and Maharashtra.','Information technology: Bengaluru and Hyderabad are major hubs, helped by skilled workers and exports.','Challenges: old technology, power shortage, pollution and competition. Policies since 1991 opened industry to more private and foreign investment.'],q:['Describe the location of the iron and steel industry.','Why is Bengaluru an IT hub?'],t:'Make a table: industry, main centres, raw material, and one problem.',m:['Manufacturing Industries',['Iron and steel',['Jamshedpur 1907','Bhilai','Rourkela','Bokaro']],['Textile and sugar',['Mumbai','Ahmedabad','UP and Maharashtra']],['IT',['Bengaluru','Hyderabad']],['Issues',['Pollution','Power shortage','Competition']]]},
'history|Kings and Chronicles':{p:['Mughal chronicles such as the Akbarnama (by Abul Fazl) and the Padshahnama (by Abdul Hamid Lahori) were written in Persian to record the emperor’s achievements.','The Mughals claimed descent from Timur. Akbar followed sulh-i-kul, universal peace and tolerance, and held discussions in the Ibadat Khana.','The mansabdari system ranked nobles with zat and sawar. The emperor appeared at the jharokha for darshan, and the court used rituals like sijda and nauroz.','Fatehpur Sikri was Akbar’s capital for a time. Painting and manuscripts show court life.','The chronicles are official histories, written from the court’s view, so check for bias.'],q:['What is sulh-i-kul?','How were Mughal chronicles produced?'],t:'Name the chronicle, author and emperor together, and state the bias.',m:['Kings and Chronicles',['Chronicles',['Akbarnama','Padshahnama','Persian']],['Akbar',['Sulh-i-kul','Ibadat Khana','Fatehpur Sikri']],['Court',['Jharokha darshan','Mansabdars','Nauroz']],['Use',['Official view','Check bias']]]},
'history|Colonial Cities':{p:['Bombay, Calcutta and Madras grew as colonial port cities. Madras grew around Fort St George (1639) and Calcutta around Fort William.','Cities had a White Town for Europeans and a Black Town for Indians, with differences in housing and facilities. Cantonments and hill stations were also built for the army and officials.','Bombay was a main port and cotton centre. Victoria Terminus (1887), in Gothic style, shows colonial architecture.','Municipal bodies, sanitation and the census began. Plague in 1896 led to strict health measures.','Cities offered new jobs and social change, but also slums and inequality.'],q:['How did the British plan colonial cities?','What was the plague’s effect on city policy?'],t:'Contrast White Town and Black Town, and give examples from one city.',m:['Colonial Cities',['Cities',['Bombay','Calcutta','Madras']],['Planning',['White Town','Black Town','Cantonments']],['Buildings',['Fort St George','Victoria Terminus']],['Issues',['Sanitation','Plague 1896','Slums']]]},
'economics|Introduction to Macroeconomics':{p:['Macroeconomics studies the economy as a whole: national output, employment, inflation, and growth. Microeconomics studies individual units.','It emerged after the Great Depression of the 1930s. John Maynard Keynes’ General Theory (1936) argued that demand is key to output and employment.','The circular flow shows the flow of income and expenditure between households, firms, government and the rest of the world.','Key concepts: stocks and flows, final and intermediate goods, consumption, investment, capital and depreciation.','Main issues: unemployment, inflation, growth, and the balance of payments.'],q:['Distinguish between micro and macro economics.','Why did macroeconomics emerge after the Great Depression?'],t:'Define stock vs flow with an example each, such as wealth and income.',m:['Introduction to Macroeconomics',['Meaning',['Whole economy','Micro vs macro']],['Origin',['Great Depression','Keynes 1936']],['Concepts',['Stock and flow','Final and intermediate goods','Depreciation']],['Issues',['Unemployment','Inflation','Growth']]]},
'economics|Open Economy Macroeconomics':{p:['Balance of payments (BoP) records all economic transactions between residents of a country and the rest of the world in a year.','Current account: trade in goods (balance of trade), services, income and transfers. Capital account: foreign investment, loans and banking capital.','Autonomous items are made for profit or other motives. Accommodating items cover a gap in the BoP, such as use of reserves.','Exchange rate: the price of one currency in terms of another. Systems are fixed, flexible and managed floating.','Depreciation lowers the value of a currency under flexible rates; devaluation is by government decision under fixed rates. Foreign exchange demand and supply decide the rate.'],q:['What is the difference between the current and capital accounts?','Explain flexible exchange rate.'],t:'Learn the components of the BoP and mark each as current or capital.',m:['Open Economy Macroeconomics',['BoP',['Current account','Capital account']],['Items',['Autonomous','Accommodating']],['Exchange rate',['Fixed','Flexible','Managed floating']],['Changes',['Depreciation','Appreciation','Devaluation']]]},
'economics|Comparative Development Experience of India':{p:['India, China and Pakistan began planned development at about the same time, in the late 1940s and 1950s, and had similar levels of development at first.','China began reforms in 1978, while Pakistan did so in 1988 and India in 1991.','China’s growth rate and manufacturing sector expanded faster than those of India and Pakistan.','India’s service sector grew most and agriculture’s share of output fell. Pakistan’s economy relies on agriculture and textiles.','On human development, China is ahead on health and education, while India and Pakistan face gaps and gender issues. Check the latest data in your textbook.'],q:['Compare the development strategies of India, China and Pakistan.','What were the reform dates in the three countries?'],t:'Build a comparison table of year, reform, growth and human development indicators.',m:['Comparative Development',['Start',['1940s and 1950s','Planning']],['Reforms',['China 1978','Pakistan 1988','India 1991']],['Sectors',['China manufacturing','India services']],['Human development',['Health','Education','Gender gap']]]},
'english|The Interview':{p:['Part one, by Christopher Silvester, discusses the interview as a form. It is a central part of journalism and media today and brings people closer to celebrities, but also has critics.','Supporters say the interview is a source of truth and a good way to get views of people. Critics say it is an intrusion in a person’s life and a rude form of reporting, even “violating” privacy. Some writers disliked it strongly.','Some famous writers refused or hated interviews. They felt it was an invasion and that it took away a part of themselves.','Part two is an interview of Umberto Eco, an Italian scholar and novelist, by Mukund Padmanabhan. They talk about his work, his novel The Name of the Rose and his interests.','Eco explains how he manages to be a scholar and a novelist at once, and he talks about the pleasure of ideas. The interview shows the interviewee’s humour and the interviewer’s skill.'],q:['What are the views for and against the interview as a form?','What does Eco say about his work as a scholar and as a novelist?'],t:'Present both sides in the first part and give one specific example from the Eco interview in the second.',m:['The Interview',['Part one',['Interview as a form','Supporters','Critics']],['Views',['Source of truth','Intrusion on privacy']],['Part two',['Umberto Eco','Mukund Padmanabhan','The Name of the Rose']],['Skills',['Good questions','Humour','Ideas']]]},
'english|Journey to the End of the Earth':{p:['Author: Tishani Doshi, who travelled to Antarctica on a student expedition. She calls it the end of the earth, a place that holds the earth’s past and warns of its future.','Antarctica was once part of Gondwana, a supercontinent that also included India. The land shows how the continents drifted apart over millions of years.','The continent is a place for scientists. It has ice, extreme cold and little life, and it is a great laboratory to study climate change.','She describes how humans are altering the earth, how the polar ice has melted and sea levels may rise. She warns that the world’s fate is connected.','Message: respect nature, understand the earth’s long history and act to save it from global warming.'],q:['Why does the author call Antarctica a place that holds the earth’s history?','What does the lesson tell us about global warming?'],t:'Mention Gondwana and climate change in every answer. They are the two main ideas.',m:['Journey to the End of the Earth',['Place',['Antarctica','Extreme cold','Ice and few living things']],['Past',['Gondwana','Continental drift']],['Present',['Research','Climate change','Melting ice']],['Message',['Save the earth','Everything is connected']]]},
'english|The Enemy':{p:['Author: Pearl S. Buck. Dr Sadao Hoki, a Japanese surgeon, trained in America, lives with his wife Hana near the sea during a war between Japan and America.','One day a wounded American prisoner of war is washed ashore. Sadao’s duty as a doctor makes him save the man, even though the man is an enemy. Hana helps him against her own feelings.','Their servants leave in protest, and Sadao reports the case to the General, who promises to send assassins. They never come, and Sadao realises the General has forgotten.','Sadao is busy treating the old General, and he decides to help the prisoner escape by boat to a nearby island, where a Korean fishing boat can pick him up.','Theme: humanity above nationality. A doctor’s duty to heal is stronger than patriotism, and war cannot destroy kindness.'],q:['Why did Sadao save the American?','What does the story say about humanity and nationalism?'],t:'Show the conflict between duty as a doctor and duty as a citizen, and say which wins.',m:['The Enemy',['Characters',['Dr Sadao','Hana','The General']],['Event',['Wounded prisoner','Operation','Servants leave']],['Conflict',['Patriotism','Duty as a doctor']],['Theme',['Humanity above war','Kindness to an enemy']]]},
'geography|Geographical Perspective on Selected Issues':{p:['Environmental pollution: air pollution from vehicles, industry and burning, and water pollution from sewage and industrial waste affects rivers like the Ganga and Yamuna.','Urban waste: cities create huge amounts of solid waste. Poor disposal causes diseases and pollution. Recycling and segregation help.','Urbanisation brings slums, overcrowding, traffic, water shortage and unemployment. Slums lack sanitation and basic services.','Land degradation: soil erosion, waterlogging and salinity reduce productivity.','Remedies: strict pollution laws, clean energy, waste management, planned cities and public awareness.'],q:['What are the problems of urban slums?','Suggest measures to control water pollution.'],t:'Give causes, effects and remedies in three short parts for each issue.',m:['Selected Issues',['Pollution',['Air','Water','Noise']],['Urban waste',['Solid waste','Disposal','Recycling']],['Urbanisation',['Slums','Overcrowding','Traffic']],['Remedies',['Laws','Clean energy','Awareness']]]},
'geography|Map work':{p:['Sea ports on the west coast: Kandla, Mumbai, Jawaharlal Nehru (Nhava Sheva), Marmagao, New Mangalore and Kochi.','East coast ports: Tuticorin, Chennai, Visakhapatnam, Paradip, Haldia and Kolkata.','International airports: Delhi, Mumbai, Chennai, Kolkata, Hyderabad, Amritsar and Ahmedabad.','Iron and steel plants: Jamshedpur, Durgapur, Bhilai, Bokaro, Rourkela, Salem, Visakhapatnam and Bhadravati.','IT hubs: Bengaluru, Hyderabad, Chennai, Pune, Noida, Gandhinagar and Thiruvananthapuram. Check your textbook’s map list for the exact items asked in the board paper.'],q:['Locate and label any five items on the outline map of India.'],t:'Use a pencil first, write names neatly in small letters and show each place with a dot or the symbol asked.',m:['Map Work',['Ports',['West coast','East coast']],['Airports',['Delhi','Mumbai','Chennai','Kolkata']],['Steel plants',['Jamshedpur','Bhilai','Bokaro','Rourkela']],['IT hubs',['Bengaluru','Hyderabad','Pune']]]},
'history|Map work':{p:['Harappan sites: Harappa, Mohenjodaro, Chanhudaro, Lothal, Kalibangan, Banawali, Dholavira, Rakhigarhi and Ropar.','Ashokan inscriptions: Kandahar, Girnar, Dhauli, Jaugada, Sopara and Kalsi.','Buddhist places: Sanchi, Sarnath, Bodh Gaya, Kushinagar and Lumbini. Medieval: Hampi (Vijayanagara) and Fatehpur Sikri.','Revolt of 1857: Meerut, Delhi, Kanpur, Lucknow, Jhansi, Jagdishpur, Bareilly and Gwalior.','Gandhi and the national movement: Champaran, Kheda, Ahmedabad, Dandi, Chauri Chaura, Amritsar (Jallianwala Bagh) and Bardoli. Check which items your textbook lists for the map question.'],q:['Locate and label any five places on the outline map of India.'],t:'Learn each place with its state, and practise by marking them on a blank map.',m:['History Map Work',['Harappa',['Harappa','Mohenjodaro','Lothal','Kalibangan']],['Early India',['Sanchi','Sarnath','Bodh Gaya']],['1857',['Meerut','Delhi','Kanpur','Jhansi']],['Gandhi',['Champaran','Dandi','Chauri Chaura']]]},
'english|Poets and Pancakes':{p:['Author: Asokamitran. A humorous memoir of his time at Gemini Studios, a film studio in Madras (now Chennai).','The make-up department used pancake make-up, a brand from Max Factor, on the actors. The author jokes about the department and the mix of people working in it.','Gemini Studios was run by its Boss, S. S. Vasan. The studio hired many writers and poets, and Kothamangalam Subbu, a poet and the Boss\u2019s trusted man, was among the best loved.','A group from the Moral Re-Armament movement visited and staged a play. Later the English poet Stephen Spender, editor of Encounter, visited the studio, and the staff did not understand who he was, which adds to the humour.','Theme: a gentle satire on the film world, the gap between art and business, and how poets and writers were seen.'],q:['What was the pancake in the title and why was it important in the studio?','How does the author make fun of the studio and its visitors?'],t:'Link the two parts of the title: pancake make-up for the film world and poets for the world of literature. Check names and details with your textbook.',m:['Poets and Pancakes',['Place',['Gemini Studios','Madras','Film world']],['Make-up',['Pancake make-up','Make-up department']],['People',['The Boss, S. S. Vasan','Subbu, the poet','Stephen Spender']],['Theme',['Satire','Art vs business','Humour']]]},
'english|Going Places':{p:['Author: A. R. Barton. Sophie is a teenage girl who dreams of a more exciting life than her ordinary home. Her friend Jansie is more practical.','Sophie imagines owning a boutique, and she tells stories about meeting Danny Casey, a famous footballer.','Her brother Geoff works in a factory, and her family and friend see her dreams as unrealistic.','The story contrasts imagination with reality. Sophie moves between her fantasy and ordinary life, and the ending shows how strongly she holds on to hope. Check the exact ending in your textbook.','Themes: adolescent dreams, ambition, class and the pull of celebrity.'],q:['What does Sophie dream about, and how does Jansie react?','What does the story show about the difference between dreams and reality?'],t:'Contrast Sophie\u2019s dreams with Jansie\u2019s practical view, and say what the ending suggests. Check details with your textbook.',m:['Going Places',['Sophie',['Dreamer','Boutique','Danny Casey']],['Jansie',['Practical','Doubts Sophie']],['Family',['Brother Geoff','Ordinary life']],['Themes',['Dreams vs reality','Ambition','Celebrity']]]},
'economics|National Income Accounting':{p:['Circular flow: households supply factors of production, firms pay rent, wages, interest and profit, and the income returns as spending.','Three methods: product (value added), income and expenditure. In theory all give the same result.','GDP = C + I + G + (X − M). GNP = GDP + net factor income from abroad. National income = NNP at factor cost.','Nominal GDP uses current prices; real GDP uses base-year prices. GDP deflator = (nominal GDP / real GDP) × 100.','GDP is an imperfect welfare measure: it ignores non-market work, externalities and income distribution.'],t:'Avoid double counting: include only final goods or value added, never intermediate goods.',m:['National Income Accounting',['Circular flow',['Households','Firms','Factor payments']],['Methods',['Value added','Income','Expenditure']],['Measures',['GDP','GNP','NNP','National income']],['Limits of GDP',['Non-market work','Externalities','Inequality']]]}

function ntHtml(){var h='';
 if(nv){var s=S.subs[nv.s],c=s.ch[nv.c],d=NT[s.id+'|'+c.n];
  h+=`<section class='sub' style='--c:${s.color}'><button class='tab' data-a='nb'>‹ All notes</button><h2>${esc(c.n)}<small>${esc(s.name)}</small></h2>`;
  if(!d)h+=`<p class='empty'>Notes for this chapter are not added yet.</p>`;
  else h+=`<ul class='pts'>${d.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class='tip'><b>Exam tip:</b> ${esc(d.t)}</div>${d.q?`<h3>Likely questions</h3><ul class='pts'>${d.q.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<h3>Mind map</h3><div class='mm'><div class='ctr'>${esc(d.m[0])}</div>${d.m.slice(1).map(b=>`<div class='brn'><b>${esc(b[0])}</b><div>${b[1].map(l=>`<span>${esc(l)}</span>`).join('')}</div></div>`).join('')}</div>`;
  return h+`<p><button class='tab' data-a='d' data-s='${nv.s}' data-c='${nv.c}'>${c.d?'✓ Chapter done':'Mark chapter done'}</button></p></section>`}
 S.subs.forEach((s,si)=>{h+=`<section class='sub' style='--c:${s.color}'><h2>${esc(s.name)}</h2><ul>`+s.ch.map((c,ci)=>`<li><button class='nl' data-a='no' data-s='${si}' data-c='${ci}'><span class='nm'>${esc(c.n)}</span><small class='tg'>${NT[s.id+'|'+c.n]?'Notes + mind map':'Coming soon'}</small></button></li>`).join('')+'</ul></section>'});
 return h}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.t){tab=b.dataset.t;nv=null;render();return}
 if(b.dataset.f){filt[b.dataset.s]=b.dataset.f;render();return}
 var a=b.dataset.a,s=S.subs[b.dataset.s],c=s&&s.ch[b.dataset.c];
 if(a==="d"){c.d=c.d?0:1;if(!c.d)c.r=0;else{var d=day();if(S.log.indexOf(d)<0)S.log.push(d)}save();render()}
 else if(a==="r"&&c.d){c.r=c.r?0:1;save();render()}
 else if(a==="x"){if(confirm("Delete “"+c.n+"”?")){s.ch.splice(b.dataset.c,1);save();render()}}
 else if(a==="add"){addCh(b.dataset.s)}
 else if(a==="no"){nv={s:+b.dataset.s,c:+b.dataset.c};render();window.scrollTo(0,0)}
 else if(a==="nb"){nv=null;render()}
 else if(b.id==="reset"){if(confirm("Clear all ticks and revisions? Your chapters stay.")){S.subs.forEach(function(s){s.ch.forEach(function(c){c.d=0;c.r=0})});S.log=[];save();render()}}
 else if(b.id==="restore"){if(confirm("Replace all subjects with the default chapter lists? Your ticks will be cleared.")){S.subs=defaults();S.log=[];save();render()}}
});
function addCh(i){var inp=document.querySelector('input[data-i="'+i+'"]'),v=inp.value.trim();if(!v)return;S.subs[i].ch.push({n:v,d:0,r:0});save();render();var n=document.querySelector('input[data-i="'+i+'"]');if(n)n.focus()}
document.addEventListener("keydown",function(e){if(e.key!=="Enter")return;if(e.target.dataset&&e.target.dataset.i!==undefined)addCh(e.target.dataset.i);});
document.getElementById("exdate").addEventListener("change",function(e){S.exam=e.target.value;save();render()});
render();
</script>
