<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board prep tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f3;--ink:#14213d;--muted:#5b6678;--card:#fff;--line:#d5dde3;--accent:#2750d9;--grid:rgba(20,33,61,.045);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--ink:#e8edf5;--muted:#9aa6b8;--card:#172131;--line:#2a3647;--accent:#6c8cff;--grid:rgba(232,237,245,.045);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1620;--ink:#e8edf5;--muted:#9aa6b8;--card:#172131;--line:#2a3647;--accent:#6c8cff;--grid:rgba(232,237,245,.045);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
main{max-width:720px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.exam{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted)}
.exam b{display:block;font-size:26px;line-height:1.1;color:var(--ink)}
.exam input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1.5px dashed var(--line);padding:2px 0;margin-top:4px}
.sum{margin:18px 0 14px;background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:16px;box-shadow:4px 4px 0 var(--ink)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big strong{font-size:48px;line-height:1;font-weight:800}
.big span{color:var(--muted)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .35s}
.facts{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px}
.tab{flex:none;font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sub{background:var(--card);border:1.5px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:14px 14px 10px;margin-bottom:14px}
.sub h2{margin:0;font-size:21px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sub h2 small{font-size:14px;font-weight:400;color:var(--muted)}
.sub .bar i{background:var(--c)}
.filters{display:flex;gap:6px;margin:2px 0 6px}
.filters button{font:inherit;font-size:13px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:#fff}
.chk svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:.18s}
.chk[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.chk[aria-pressed="true"] svg{opacity:1;transform:none}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
li.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.rev{flex:none;font:inherit;font-size:12px;padding:3px 8px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.rev[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rev:disabled{opacity:.35;cursor:default}
.del{flex:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.add{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.add button,.foot button{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.foot button{background:transparent;color:var(--ink);font-size:14px}
.empty{color:var(--muted);padding:10px 0;font-size:14px}
.tg{color:var(--muted);font-size:13px;margin-left:4px}
.pts{list-style:disc;padding-left:20px;margin:8px 0}.pts li{display:list-item;border:0;padding:5px 0}.tip{margin:10px 0;padding:10px 12px;border-radius:8px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}.sub h3{margin:16px 0 8px;font-size:17px}.mm{display:grid;gap:12px}.ctr{justify-self:center;background:var(--c);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;text-align:center}.brn{border-left:4px solid var(--c);padding:2px 0 2px 12px;margin-left:12px}.brn b{display:block;margin-bottom:5px}.brn div{display:flex;flex-wrap:wrap;gap:6px}.brn span{font-size:13px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--c)}.nl{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font:inherit;color:inherit;background:transparent;border:0;text-align:left;cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
 <div class="top">
  <h1>Board prep<br>tracker</h1>
  <div class="exam"><span id="exlab">Days to boards</span><b id="exnum">–</b><input type="date" id="exdate" aria-label="Exam start date"></div>
 </div>
 <section class="sum" id="sum"></section>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div id="list"></div>
 <div class="foot">
  <button id="reset">Reset all progress</button>
  <button id="restore">Restore default chapters</button>
 </div>
</main>
<script>
var CHK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
function mk(name,color,arr){return{id:name.toLowerCase().replace(/\W/g,''),name:name,color:color,ch:arr.map(function(n){return{n:n,d:0,r:0}})}}
function defaults(){return[
 mk("English","#d6336c",["The Last Lesson","Lost Spring","Deep Water","The Rattrap","Indigo","Poets and Pancakes","The Interview","Going Places","My Mother at Sixty-six","Keeping Quiet","A Thing of Beauty","A Roadside Stand","Aunt Jennifer’s Tigers","The Third Level","The Tiger King","Journey to the End of the Earth","The Enemy","On the Face of It","Memories of Childhood","Writing skills (notice, letter, article, report)"]),
 mk("Maths","#2750d9",["Relations and Functions","Inverse Trigonometric Functions","Matrices","Determinants","Continuity and Differentiability","Application of Derivatives","Integrals","Application of Integrals","Differential Equations","Vector Algebra","Three Dimensional Geometry","Linear Programming","Probability"]),
 mk("Geography","#1a8f5a",["Human Geography: Nature and Scope","The World Population","Human Development","Primary Activities","Secondary Activities","Tertiary and Quaternary Activities","Transport and Communication","International Trade","Human Settlements","Population of India","Land Resources and Agriculture","Water Resources","Mineral and Energy Resources","Manufacturing Industries","Planning and Sustainable Development","Geographical Perspective on Selected Issues","Map work"]),
 mk("History","#b7791f",["Bricks, Beads and Bones","Kings, Farmers and Towns","Kinship, Caste and Class","Thinkers, Beliefs and Buildings","Through the Eyes of Travellers","Bhakti–Sufi Traditions","An Imperial Capital: Vijayanagara","Peasants, Zamindars and the State","Kings and Chronicles","Colonialism and the Countryside","Rebels and the Raj","Colonial Cities","Mahatma Gandhi and the Nationalist Movement","Understanding Partition","Framing the Constitution","Map work"]),
 mk("Economics","#7c3aed",["Introduction to Macroeconomics","National Income Accounting","Money and Banking","Determination of Income and Employment","Government Budget and the Economy","Open Economy Macroeconomics","Indian Economy on the Eve of Independence","Indian Economy 1950–1990","Liberalisation, Privatisation and Globalisation","Poverty","Human Capital Formation","Rural Development","Employment","Environment and Sustainable Development","Comparative Development Experience of India"])]}
var KEY="boardprep.v1",mem=null,S,tab="all",filt={};
function load(){try{var t=localStorage.getItem(KEY);if(t)return JSON.parse(t)}catch(e){}return mem}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load()||{exam:"",subs:defaults(),log:[]};
if(!S.exam)S.exam="2027-02-01";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function day(d){var x=d||new Date();return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)}
function streak(){var n=0,d=new Date();if(S.log.indexOf(day(d))<0)d.setDate(d.getDate()-1);while(S.log.indexOf(day(d))>=0){n++;d.setDate(d.getDate()-1)}return n}
function daysLeft(){if(!S.exam)return null;var a=new Date(S.exam+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function totals(list){var t=0,d=0,r=0;list.forEach(function(s){s.ch.forEach(function(c){t++;d+=c.d;r+=c.r})});return{t:t,d:d,r:r}}
function render(){
 var T=totals(S.subs),pct=T.t?Math.round(T.d/T.t*100):0,dl=daysLeft(),left=T.t-T.d;
 var ex=document.getElementById("exnum");
 ex.textContent=dl===null?"Set date":dl<0?"Exams started":dl===0?"Today":dl;
 document.getElementById("exlab").textContent=dl!==null&&dl>0?"Days to boards":"Boards date";
 document.getElementById("exdate").value=S.exam;
 var pace="";
 if(dl!==null&&dl>0&&left>0){var w=Math.max(1,Math.ceil(dl/7));pace='<span>Pace needed: <b>'+Math.ceil(left/w)+' chapters/week</b></span>'}
 else if(left===0&&T.t){pace='<span><b>All chapters done. Keep revising!</b></span>'}
 var sk=streak();
 document.getElementById("sum").innerHTML='<div class="big"><strong>'+pct+'%</strong><span>'+T.d+' of '+T.t+' chapters done</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="facts"><span>Revised: <b>'+T.r+'</b></span><span>Left: <b>'+left+'</b></span><span>Streak: <b>'+sk+' day'+(sk===1?'':'s')+'</b></span>'+pace+'</div>';
 var tabs='<button class="tab" role="tab" data-t="all" aria-selected="'+(tab==="all")+'">All subjects</button>';
 S.subs.forEach(function(s){tabs+='<button class="tab" role="tab" data-t="'+s.id+'" aria-selected="'+(tab===s.id)+'">'+esc(s.name)+'</button>'});
 tabs+=`<button class='tab' role='tab' data-t='notes' aria-selected='${tab==="notes"}'>Notes</button>`;
 document.getElementById("tabs").innerHTML=tabs;
 document.getElementById("sum").style.display=tab==="notes"?"none":"";
 var h="";
 S.subs.forEach(function(s,si){
  if(tab!=="all"&&tab!==s.id)return;
  var t=totals([s]),p=t.t?Math.round(t.d/t.t*100):0,f=filt[s.id]||"all";
  h+='<section class="sub" style="--c:'+s.color+'"><h2>'+esc(s.name)+'<small>'+t.d+'/'+t.t+' · '+p+'%</small></h2><div class="bar"><i style="width:'+p+'%"></i></div>';
  h+='<div class="filters">'+["all","todo","done"].map(function(k){return'<button data-f="'+k+'" data-s="'+s.id+'" aria-pressed="'+(f===k)+'">'+{all:"All",todo:"To do",done:"Done"}[k]+'</button>'}).join("")+'</div><ul>';
  var shown=0;
  s.ch.forEach(function(c,ci){
   if(f==="todo"&&c.d||f==="done"&&!c.d)return;shown++;
   h+='<li class="'+(c.d?'done':'')+'"><button class="chk" data-a="d" data-s="'+si+'" data-c="'+ci+'" aria-pressed="'+!!c.d+'" aria-label="Mark '+esc(c.n)+' as done">'+CHK+'</button><span class="nm">'+esc(c.n)+'</span><button class="rev" data-a="r" data-s="'+si+'" data-c="'+ci+'" aria-pressed="'+!!c.r+'"'+(c.d?'':' disabled')+'>Revised</button><button class="del" data-a="x" data-s="'+si+'" data-c="'+ci+'" aria-label="Delete '+esc(c.n)+'">×</button></li>'});
  if(!shown)h+='<li class="empty">'+(f==="done"?"No chapters done yet. Tick one when you finish it.":"Nothing left here. Nice work.")+'</li>';
  h+='</ul><div class="add"><input data-i="'+si+'" placeholder="Add a chapter or topic" aria-label="Add chapter to '+esc(s.name)+'"><button data-a="add" data-s="'+si+'">Add chapter</button></div></section>'});
 if(tab==="notes")h=ntHtml();
 document.getElementById("list").innerHTML=h;
}
var nv=null;
var NT={
'english|The Last Lesson':{p:['Author: Alphonse Daudet. Setting: a village school in Alsace, France, after Prussia orders that German replace French (Franco-Prussian War).','Franz, who dislikes studying, arrives late and is surprised to see villagers sitting at the back of the class.','M. Hamel teaches his last lesson with deep love for French. He blames parents and himself for neglecting learning, and calls French the clearest, most logical language.','Franz regrets wasting time and feels sad that he cannot write French properly.','Theme: language is identity. If a people hold on to their language, it is like holding the key to their prison. Hamel ends by writing Vive la France on the board.'],t:'Trace Franz’s change from careless to remorseful, and link it to linguistic chauvinism and patriotism in long answers.',m:['The Last Lesson',['Setting',['Alsace','Franco-Prussian War','German order']],['Characters',['Franz','M. Hamel','Old Hauser']],['Change in Franz',['Dislikes school','Regrets wasted time','Loves French']],['Themes',['Language and identity','Patriotism','Regret']]]},
'english|Indigo':{p:['Author: Louis Fischer. In 1916 Rajkumar Shukla, a poor peasant from Champaran, persuaded Gandhi to visit Bihar and see the plight of indigo sharecroppers.','Under the tinkathia system, peasants had to grow indigo on 3/20 of their land for British planters. Synthetic dye made indigo less valuable, so planters demanded compensation to release the tenants.','Gandhi was ordered to leave Motihari, refused, and was summoned to court. The case was dropped, his first act of civil disobedience in India.','A commission of inquiry ordered a 25% refund to the peasants. Gandhi accepted because the real gain was breaking the planters’ prestige.','Gandhi also started village schools and health work, and taught peasants self-reliance and freedom from fear.'],t:'Link Gandhi’s courage, patience and self-reliance to the lesson in every long answer.',m:['Indigo',['People',['Gandhi','Rajkumar Shukla','British planters']],['Problem',['Tinkathia system','3/20 of land','Synthetic dye']],['Gandhi’s action',['Refused to leave','Court case dropped','Inquiry commission']],['Outcome',['25% refund','Fear removed','Self-reliance']]]},
'maths|Determinants':{p:['A determinant exists only for a square matrix and is a single number.','2x2: |a b; c d| = ad − bc. For 3x3, expand along any row or column using minors and cofactors with the sign pattern + − +.','Properties: swapping two rows changes the sign; two identical rows give 0; |AB| = |A||B|; |kA| = kⁿ|A| for order n.','Inverse: A⁻¹ = adj(A)/|A|, possible only if |A| ≠ 0. Also A·adj(A) = |A|·I.','Area of a triangle = ½ |determinant of the vertices|. Solve linear equations by X = A⁻¹B when |A| ≠ 0.'],t:'Check |A| ≠ 0 before writing an inverse, and write the cofactor sign pattern before expanding.',m:['Determinants',['Basics',['Square matrices only','2x2: ad − bc','Minors and cofactors']],['Properties',['Row swap: sign change','Identical rows: 0','|AB| = |A||B|']],['Inverse',['adj(A)/|A|','|A| ≠ 0','A·adj A = |A| I']],['Uses',['Area of triangle','Solve equations','Consistency check']]]},
'maths|Integrals':{p:['Integration reverses differentiation. Always add + C for indefinite integrals.','Standard forms: ∫xⁿ dx = xⁿ⁺¹/(n+1) + C; ∫1/x dx = ln|x| + C; ∫eˣ dx = eˣ + C; ∫sin x dx = −cos x + C; ∫cos x dx = sin x + C; ∫sec²x dx = tan x + C.','Methods: substitution, integration by parts, partial fractions. By parts: ∫u·v dx = u∫v dx − ∫(du/dx · ∫v dx) dx, choosing u by ILATE.','Definite integral: ∫ₐᵇ f dx = F(b) − F(a). Use ∫ₐᵇ f(x)dx = ∫ₐᵇ f(a+b−x)dx to simplify.','Even function: ∫₋ₐᵃ f = 2∫₀ᵃ f. Odd function: ∫₋ₐᵃ f = 0.'],t:'Practise ∫dx/(x²±a²), ∫dx/√(a²−x²) and ∫√(a²−x²)dx. They appear almost every year.',m:['Integrals',['Standard forms',['Powers','Trigonometric','Exponential and log']],['Methods',['Substitution','By parts (ILATE)','Partial fractions']],['Definite integral',['F(b) − F(a)','a+b−x property','Even and odd']],['Remember',['Add + C','Change limits when substituting']]]},
'maths|Probability':{p:['Conditional probability: P(A|B) = P(A∩B)/P(B), with P(B) ≠ 0.','Multiplication rule: P(A∩B) = P(A)·P(B|A). For independent events, P(A∩B) = P(A)·P(B).','Total probability: P(A) = ΣP(Eᵢ)·P(A|Eᵢ) over a partition E₁ … Eₙ.','Bayes’ theorem: P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / ΣP(Eⱼ)P(A|Eⱼ).','Random variable: mean E(X) = ΣxP(x), variance = E(X²) − [E(X)]². Binomial: P(X = r) = ⁿCᵣ pʳ qⁿ⁻ʳ.'],t:'In Bayes’ questions, list the events and their probabilities in a small table first, then apply the formula.',m:['Probability',['Conditional',['P(A|B)','Multiplication rule','Independence']],['Total probability',['Partition of events','Sum of products']],['Bayes’ theorem',['Reverse probability','Priors and likelihoods']],['Distributions',['Mean and variance','Binomial']]]},
'geography|Human Development':{p:['Human development means enlarging people’s choices. The idea was developed by Mahbub ul Haq and Amartya Sen; UNDP published the first Human Development Report in 1990.','Four pillars: equity, sustainability, productivity, empowerment.','HDI measures three dimensions: a long and healthy life (life expectancy), knowledge (education), and a decent standard of living (income per capita).','Approaches to study it: income, welfare, minimum needs, capability.','Countries are grouped as very high, high, medium and low human development.'],t:'Name the four pillars and three HDI dimensions in every answer, and draw the HDI components as a small diagram.',m:['Human Development',['Idea',['Mahbub ul Haq','Amartya Sen','Choices of people']],['Four pillars',['Equity','Sustainability','Productivity','Empowerment']],['HDI dimensions',['Health: life expectancy','Education: schooling','Income per capita']],['Approaches',['Income','Welfare','Minimum needs','Capability']]]},
'geography|Primary Activities':{p:['Primary activities depend directly on the earth’s resources: hunting, gathering, pastoralism, fishing, forestry, mining and agriculture. Workers are called red-collar workers.','Subsistence farming: primitive (shifting cultivation such as jhum) and intensive subsistence (common in monsoon Asia, e.g. wet paddy).','Commercial farming: plantation, mixed farming, dairy, Mediterranean agriculture, market gardening and horticulture.','Mining depends on the value of the mineral, size and grade of ore, ease of extraction and transport. It can be surface (open-cast) or underground.'],t:'Make a table of farming types with region and main crop. It covers many 3 and 5 mark questions.',m:['Primary Activities',['Types',['Hunting and gathering','Pastoralism','Fishing','Mining','Agriculture']],['Subsistence farming',['Shifting cultivation','Intensive subsistence']],['Commercial farming',['Plantation','Mixed farming','Dairy','Market gardening']],['Mining',['Surface','Underground','Ore and cost factors']]]},
'history|Mahatma Gandhi and the Nationalist Movement':{p:['Gandhi returned from South Africa in 1915. Early local campaigns: Champaran (1917), Ahmedabad mill workers (1918), Kheda (1918).','The Rowlatt Satyagraha (1919) and the Jallianwala Bagh massacre (13 April 1919) made him a national leader.','Non-Cooperation Movement (1920–22) joined the Khilafat issue. It was called off after Chauri Chaura (1922).','Dandi March began on 12 March 1930 against the salt tax, starting Civil Disobedience. Gandhi–Irwin Pact followed in 1931. Quit India (1942) gave the call Do or Die.','Gandhi’s strength: a mass base among peasants and workers, non-violence, constructive work such as khadi, and outreach to Hindus and Muslims.'],t:'Learn a one-line cause and result for each movement and make a timeline from 1915 to 1948.',m:['Gandhi and the Nationalist Movement',['Early (1915–18)',['Champaran','Ahmedabad','Kheda']],['Mass movements',['Rowlatt Satyagraha','Non-Cooperation','Civil Disobedience','Quit India']],['Key events',['Jallianwala Bagh 1919','Chauri Chaura 1922','Dandi March 1930']],['Method',['Non-violence','Satyagraha','Khadi and constructive work']]]},
'history|Understanding Partition':{p:['The 1947 Partition caused one of the largest forced migrations in history, with mass violence. Estimates of deaths vary widely.','Causes: colonial divide and rule, separate electorates, the two-nation idea, the Lahore Resolution (1940), and Direct Action Day (16 August 1946) with the Calcutta riots.','The Cabinet Mission (1946) failed. The Mountbatten Plan came on 3 June 1947, and the Radcliffe Line divided Punjab and Bengal.','Oral history records survivors’ memories, diaries and testimonies that official records miss, but it has limits: memory and bias.','Aftermath: refugees, rehabilitation, and the recovery of abducted women.'],t:'Use oral history to show lived experience, and mention its limits when you evaluate it as a source.',m:['Understanding Partition',['Causes',['Divide and rule','Separate electorates','Two-nation idea','Direct Action Day']],['Key steps',['Cabinet Mission 1946','Mountbatten Plan 1947','Radcliffe Line']],['Impact',['Mass migration','Violence','Refugees','Abducted women']],['Sources',['Oral history','Memoirs','Government records']]]},
'economics|Money and Banking':{p:['Functions of money: medium of exchange, unit of account, store of value, standard of deferred payment. Barter needs a double coincidence of wants.','Demand for money: transactions demand rises with income; speculative demand falls as the interest rate rises.','Money supply: currency held by the public plus demand deposits. The RBI issues currency, is banker to the government, and controls credit.','Banks create credit: money multiplier = 1/reserve ratio (CRR).','RBI tools: CRR, SLR, repo rate, reverse repo rate, bank rate, open market operations and margin requirement.'],t:'Learn the repo effect: a higher repo rate makes loans costlier, reduces credit and reduces money supply.',m:['Money and Banking',['Functions of money',['Medium of exchange','Unit of account','Store of value']],['Money supply',['Currency','Demand deposits','Money multiplier']],['Commercial banks',['Accept deposits','Give loans','Create credit']],['RBI tools',['CRR and SLR','Repo and reverse repo','Open market operations']]]},
'english|Lost Spring':{p:['Author: Anees Jung. Subtitle: Stories of Stolen Childhood. It shows how poverty and tradition rob children of their childhood.','Saheb-e-Alam: a ragpicker boy whose family left Dhaka, Bangladesh after storms destroyed their fields. They live in Seemapuri, on the edge of Delhi, among squatters without papers or sanitation. For them garbage is gold, a means of survival.','Saheb dreams of tennis shoes and watches the club courts from outside. Later he works at a tea stall for Rs 800 and meals, but he is no longer carefree. The plastic bag was his own; the steel canister is not. His name means lord of the universe, which is ironic.','Mukesh: lives in Firozabad, the glass-bangle capital, where families have made bangles for generations. His grandmother says it is their karma, the fate of the caste of bangle makers.','Workers sit in dark, hot, poorly ventilated rooms near furnaces, and many lose their eyesight before they are adults. They are trapped by a cycle: moneylenders, middlemen, police and politicians.','Mukesh is different: he wants to be a motor mechanic and will walk to a garage. Hope and courage break the cycle of poverty.'],q:['How does the title Lost Spring suit the lesson?','Compare Saheb and Mukesh: what do they dream of and what stops them?','Why is the name Saheb-e-Alam ironic?'],t:'Quote the contrast between names and reality, and bring in child labour, poverty, caste and exploitative middlemen.',m:['Lost Spring',['Saheb',['Ragpicker from Dhaka','Seemapuri, Delhi','Dreams of tennis shoes','Tea stall job']],['Mukesh',['Firozabad bangles','Family karma','Wants to be a mechanic']],['Causes',['Poverty','Caste and tradition','Middlemen and police']],['Effects',['Lost education','Health damage','Lost childhood']]]},
'english|Deep Water':{p:['Author: William O. Douglas, later a judge of the US Supreme Court. The lesson is about overcoming fear.','As a child he was knocked down by a wave on a California beach and was frightened of water. Later, at about ten or eleven, he decided to learn to swim at the YMCA pool in Yakima.','At the pool a big bully threw him into the deep end. He sank, planned to push up from the bottom, but panicked, swallowed water and lost consciousness. He was rescued.','The experience left him with a deep fear of water. It ruined fishing, canoeing and swimming trips for years.','He hired an instructor who trained him patiently in the pool, using a rope and teaching him to move his legs, arms and breathe, a piece at a time, over months.','The fear returned once at Lake Wentworth, but he faced it and swam across. He realised he had conquered terror. The message is Roosevelt’s: we have nothing to fear but fear itself.'],q:['Describe the experience that caused Douglas’s fear of water.','How did he overcome his fear?','What does the lesson teach about fear and willpower?'],t:'Structure answers as cause of fear, effect on his life, steps to conquer it, and the lesson. Use the last line to show growth.',m:['Deep Water',['Fear',['Wave on a California beach','Bully at Yakima YMCA pool','Panic and rescue']],['Effects',['Avoided water','Spoiled trips','Fear for years']],['Recovery',['Hired an instructor','Practised step by step','Swam at Lake Wentworth']],['Lesson',['Willpower','Face fear','Nothing to fear but fear']]]},
'maths|Matrices':{p:['A matrix of order m x n has m rows and n columns. Types: row, column, square, diagonal, scalar, identity, zero.','Addition needs equal order. Multiplication AB needs columns of A = rows of B, and AB is usually not equal to BA. A zero product does not imply a zero matrix.','Transpose rules: (A′)′ = A, (A+B)′ = A′ + B′, (kA)′ = kA′, (AB)′ = B′A′.','Symmetric: A′ = A. Skew-symmetric: A′ = -A (diagonal entries are 0). Any square matrix = symmetric part (A+A′)/2 + skew part (A-A′)/2.','Inverse: AB = BA = I. A square matrix has an inverse only if it is non-singular. (AB)^-1 = B^-1 A^-1, and the inverse is unique.','Elementary row operations: swap two rows, multiply a row by a non-zero constant, add a multiple of one row to another. Use them to find the inverse by [A | I] -> [I | A^-1].'],q:['Express a square matrix as the sum of a symmetric and a skew-symmetric matrix.','Find the inverse of a 2x2 or 3x3 matrix by elementary row operations.','Prove (AB)′ = B′A′ or find A² for a given matrix.'],t:'Check orders before multiplying, and write each row operation next to the matrix. Marks are given for steps.',m:['Matrices',['Types',['Square, diagonal, scalar','Identity and zero','Symmetric, skew-symmetric']],['Operations',['Addition: same order','Multiplication: columns = rows','Transpose rules']],['Inverse',['Non-singular only','(AB)^-1 = B^-1 A^-1','Row operations on [A | I]']],['Remember',['AB is not BA','Skew diagonal = 0']]]},
'maths|Application of Derivatives':{p:['dy/dx is the rate of change of y with respect to x. Related-rate questions use the chain rule: dy/dt = (dy/dx)(dx/dt).','Increasing: f′(x) > 0. Decreasing: f′(x) < 0 on an interval. Find the critical points, then test the sign of f′ in each interval.','Tangent at (x1, y1): y - y1 = f′(x1)(x - x1). Normal has slope -1/f′(x1), so its equation is y - y1 = (-1/f′(x1))(x - x1).','First derivative test: sign change of f′ from + to - gives a maximum; - to + gives a minimum.','Second derivative test: at a critical point, f″ < 0 gives a local maximum, f″ > 0 a local minimum, and f″ = 0 means the test fails.','Absolute maximum or minimum on [a, b]: compare f at the critical points and the endpoints. Approximation: delta y ≈ f′(x) delta x.','Optimisation: write the quantity as a function of one variable, differentiate, set it to zero, and verify it is a max or min.'],q:['Find the intervals in which f(x) is increasing or decreasing.','Find the local maximum and minimum values.','A word problem: maximise the volume or area, or minimise the cost.'],t:'In optimisation problems, always define the variable, write the constraint, and justify the max or min with f″.',m:['Application of Derivatives',['Rate of change',['dy/dx','Related rates','Chain rule']],['Monotonicity',['f′ > 0: increasing','f′ < 0: decreasing','Critical points']],['Tangent and normal',['Slope = f′(x1)','Normal: -1/slope']],['Maxima and minima',['First derivative test','Second derivative test','Closed interval: check endpoints']]]},
'geography|The World Population':{p:['About 90 per cent of the world’s population lives in about 10 per cent of the land area. Distribution is uneven.','Geographical factors: availability of water, landforms (plains attract people, mountains do not), climate, soils. Economic: minerals, urbanisation, industrialisation. Social and cultural: religious or cultural significance, and political stability.','Density: arithmetic density = people per sq km of total land; physiological density = people per sq km of cultivable land; agricultural density = farmers per sq km of cultivable land.','Growth: natural increase = births - deaths. Total change also includes migration. Population growth is described by birth rate, death rate and migration.','Demographic transition has three stages: high birth and high death rates (low growth); falling death rate with high birth rate (rapid growth); low birth and low death rates (stable).','Population control: Positive checks like famine and war; preventive checks like family planning and education.'],q:['Explain the factors affecting the distribution of population.','Distinguish between physiological and agricultural density.','Describe the three stages of demographic transition.'],t:'Draw the demographic transition graph with the three stages labelled, since it earns full marks.',m:['The World Population',['Distribution',['90% in 10% of land','Geographical factors','Economic factors','Social and cultural']],['Density',['Arithmetic','Physiological','Agricultural']],['Growth',['Birth rate','Death rate','Migration']],['Transition',['Stage 1: high and high','Stage 2: rapid growth','Stage 3: low and low']]]},
'history|Bricks, Beads and Bones':{p:['The Harappan civilisation: the mature phase was about 2600-1900 BCE. Harappa was found by Daya Ram Sahni (1921) and Mohenjodaro by R. D. Banerji (1922). John Marshall was then Director-General of the ASI.','Town planning: a citadel (west) and a lower town (east); a grid pattern of streets; covered drains running along streets; burnt bricks in a standard ratio.','Important structures: the Great Bath at Mohenjodaro (probably for ritual bathing) and granaries.','Craft and trade: beads of carnelian, steatite and shell; seals; weights. Trade with Mesopotamia (Meluhha). Craft centres were Chanhudaro and Lothal.','Subsistence: wheat, barley, pulses, sesame, peas. Evidence includes terracotta bull and plough models, and the ploughed field at Kalibangan.','Social differences: evidence from burials, grave goods and luxury goods in a few places. The script is still undeciphered. Decline around 1900 BCE: climate change, deforestation, floods, river shifts.','Archaeologists infer from material remains. Interpretation is a challenge, so the Great Bath and priest-king are only guesses.'],q:['Describe the town planning of the Harappan civilisation.','How do we know about trade and craft in Harappa?','Why is it difficult to reconstruct the Harappan past?'],t:'Always give the evidence (archaeological source) before the inference in a source-based answer.',m:['Bricks, Beads and Bones',['Discovery',['Daya Ram Sahni 1921','R. D. Banerji 1922','John Marshall']],['Town planning',['Citadel and lower town','Drains','Great Bath','Granaries']],['Economy',['Agriculture','Craft: beads, seals','Trade with Mesopotamia']],['Decline',['Climate change','Floods','River shifts','Deforestation']]]},
'history|Framing the Constitution':{p:['The Constituent Assembly was formed under the Cabinet Mission Plan (1946). It first met on 9 December 1946. Rajendra Prasad became president, and B. R. Ambedkar chaired the Drafting Committee.','Nehru moved the Objectives Resolution on 13 December 1946, which set the aims of the Constitution: sovereign republic, justice, equality, freedom.','The Constitution was adopted on 26 November 1949 and came into force on 26 January 1950.','Separate electorates were opposed by Patel and Pant (national unity). Muslim League and others had asked for them. They were finally rejected.','Language debate: Hindi supporters like R. V. Dhulekar wanted Hindi as the national language. The compromise: Hindi in Devanagari as the official language, with English to continue for 15 years.','Centre-state relations: the framers chose a strong Centre with a federal structure, after the trauma of Partition. Jaipal Singh spoke for tribal rights, and the Assembly debated the rights of minorities, depressed classes and states.'],q:['What was the Objectives Resolution and why was it important?','Discuss the debate on separate electorates.','How did the Assembly resolve the language question?'],t:'Use names and years: who said what, and what the compromise was. This lesson is full of debates.',m:['Framing the Constitution',['Assembly',['First met Dec 1946','Rajendra Prasad: president','Ambedkar: Drafting Committee']],['Objectives Resolution',['Moved by Nehru','13 Dec 1946','Aims of the Constitution']],['Debates',['Separate electorates','Language','Centre and states','Tribal rights']],['Result',['Adopted 26 Nov 1949','In force 26 Jan 1950']]]},
'economics|Government Budget and the Economy':{p:['The budget is the annual statement of estimated receipts and expenditure of the government (Article 112). It is presented for one financial year, April to March.','Objectives: reallocation of resources, redistribution of income and wealth, and economic stability. Fiscal policy uses taxes and spending.','Receipts: revenue receipts (tax and non-tax) and capital receipts (borrowings, recovery of loans, disinvestment). Expenditure: revenue expenditure and capital expenditure.','Revenue deficit = revenue expenditure - revenue receipts.','Fiscal deficit = total expenditure - total receipts excluding borrowings. It equals the government’s borrowing requirement.','Primary deficit = fiscal deficit - interest payments.','Deficit is financed by borrowing or printing money. High deficits can raise debt and inflation. The FRBM Act aims to limit deficits.'],q:['Distinguish between revenue and capital receipts.','Define fiscal deficit and primary deficit with formulas.','Explain the three objectives of the government budget.'],t:'Learn the three deficit formulas exactly. Numerical questions on them appear every year.',m:['Government Budget',['Objectives',['Reallocation','Redistribution','Stabilisation']],['Receipts',['Revenue: tax, non-tax','Capital: borrowing, loans, disinvestment']],['Expenditure',['Revenue','Capital']],['Deficits',['Revenue deficit','Fiscal deficit','Primary deficit']]]},
'economics|Poverty':{p:['Poverty line: a minimum level of income or consumption needed to meet basic needs. It uses a calorie norm of about 2400 calories per day in rural areas and 2100 in urban areas.','The head count ratio is the share of people below the poverty line. Poverty is measured using the Planning Commission and expert committees such as the Tendulkar Committee.','Absolute poverty means not meeting basic needs; relative poverty compares groups or regions.','Causes: low growth in the colonial period, high population, unemployment, inequality, illiteracy and social factors like caste and gender.','Anti-poverty strategy: growth-oriented policies and direct programmes such as MGNREGA (wage employment), PMGSY (rural roads) and food security through the Public Distribution System.','Poverty is not only about income. Education, health, sanitation and employment are also part of human poverty.'],q:['What is the poverty line? How is it estimated?','Explain any two anti-poverty programmes.','Discuss the main causes of poverty in India.'],t:'Mention both approaches: growth and direct programmes, and give at least two named schemes.',m:['Poverty',['Measure',['Poverty line','Calorie norm 2400 and 2100','Head count ratio']],['Types',['Absolute','Relative']],['Causes',['Colonial history','Population','Unemployment','Inequality']],['Remedies',['Growth policies','MGNREGA','PMGSY','Public Distribution System']]]},
'english|The Rattrap':{p:['Author: Selma Lagerlöf. A peddler sells small wire rattraps but survives mostly by begging and petty theft. He thinks the whole world is a rattrap: it offers riches, shelter and food as bait, and once you touch it, it closes on you.','A kind old crofter gives him food, shelter and company. He proudly shows the peddler his thirty kronor, and the peddler steals them next morning.','Fearing capture, he avoids the highway, wanders in the forest and realises he himself is caught in the rattrap.','At the Ramsjö ironworks the ironmaster mistakes him for an old friend, Captain von Stahle, and invites him home. The peddler refuses, but the ironmaster’s daughter Edla kindly persuades him to stay for Christmas.','Edla treats him with respect even after learning he is not the captain. He leaves the stolen money in a rattrap as a Christmas gift for her, signing himself Captain von Stahle. Kindness has changed him.'],q:['Why did the peddler think the world was a rattrap?','How did Edla’s kindness change the peddler?'],t:'Use the rattrap metaphor in every answer, and show the change from selfishness to goodness through the gift.',m:['The Rattrap',['Peddler',['Sells rattraps','Begs and steals','World is a rattrap']],['Crofter',['Hospitality','Thirty kronor stolen']],['Ironmaster and Edla',['Mistaken identity','Edla’s kindness','Christmas invitation']],['Change',['Returns the money','Rattrap gift','Goodness wins']]]},
'english|My Mother at Sixty-six':{p:['Poet: Kamala Das. She is driving to Cochin airport with her mother, and looks at her mother dozing beside her.','Her mother’s face is pale and ashen like a corpse, which makes the poet recall her old fear of losing her.','Outside, young trees sprint and children spill out of their homes, full of life, in sharp contrast with her mother’s age.','At the airport, after security check, she looks at her mother again, who looks like a late winter’s moon, pale and faint. She hides her fear and smiles.','Themes: ageing, love and fear of separation, a child’s helplessness. Devices: simile, contrast, imagery, enjambment.'],q:['What is the poet’s childhood fear? How does she deal with it?','What do the young trees and children suggest?'],t:'Identify the contrast between youth and old age, and the simile of the late winter’s moon, in every answer.',m:['My Mother at Sixty-six',['Journey',['Drive to the airport','Mother dozes','Pale face']],['Contrast',['Old mother','Young trees','Playing children']],['Feelings',['Old fear of loss','Love','Brave smile']],['Devices',['Simile','Imagery','Contrast']]]},
'maths|Relations and Functions':{p:['A relation from A to B is a subset of A x B. Types: empty, universal, reflexive (aRa), symmetric (aRb implies bRa), transitive (aRb and bRc imply aRc).','An equivalence relation is reflexive, symmetric and transitive. It partitions the set into equivalence classes.','Functions: one-one (injective): distinct elements have distinct images. Onto (surjective): range equals codomain. Bijective: both.','If n(A) = m and n(B) = n, the number of functions is n^m. The number of one-one functions from A to B is n!/(n-m)! when m ≤ n.','Composition: (g o f)(x) = g(f(x)). A function is invertible if and only if it is bijective. Check your syllabus for composition and binary operations, as these have changed in some years.'],q:['Show that a relation is an equivalence relation.','Show that a function is one-one and onto.'],t:'For proofs, take elements a, b, c explicitly and write each of the three properties as a separate line.',m:['Relations and Functions',['Relations',['Reflexive','Symmetric','Transitive','Equivalence']],['Functions',['One-one','Onto','Bijective']],['Counting',['n^m functions','One-one: n!/(n-m)!']],['Inverse',['Needs bijective','Composition g(f(x))']]]},
'maths|Linear Programming':{p:['A linear programming problem optimises (maximises or minimises) a linear objective function Z = ax + by subject to linear constraints and x ≥ 0, y ≥ 0.','Steps: define variables, write the objective function and constraints, draw the feasible region, find the corner points, and evaluate Z at each.','Corner point theorem: if the feasible region is bounded, the maximum and minimum of Z occur at corner points.','If the region is unbounded, a maximum or minimum may not exist. Draw the half-plane Z > M or Z < M to check whether it has a common point with the region.','Common types: diet problem (minimise cost), production or manufacturing problem (maximise profit), transportation problem.'],q:['Maximise Z = ax + by subject to given constraints, using a graph.','Formulate a manufacturing or diet problem as an LPP.'],t:'Shade the feasible region clearly, label every corner point with its coordinates, and show a table of Z values.',m:['Linear Programming',['Formulation',['Objective function','Constraints','x, y ≥ 0']],['Graph',['Draw lines','Feasible region','Corner points']],['Solution',['Evaluate Z at corners','Bounded: max and min exist']],['Unbounded case',['Check open half-plane','May have no optimum']]]},
'geography|Water Resources':{p:['India has about 4 per cent of the world’s fresh water but a much larger share of the world’s population, so per-capita availability is low and falling.','Sources: surface water (rivers, lakes, ponds, tanks) and groundwater. Rainfall is uneven in space and time, which causes floods and droughts.','Agriculture uses most of the water (about 90 per cent in older estimates), with industry and domestic use far behind.','Problems: overuse of groundwater, falling water tables, pollution of rivers and growing demand from industry and cities.','Conservation: rainwater harvesting, watershed management, recycling and reuse of water, efficient irrigation like drip and sprinkler, and public awareness. Government schemes include Namami Gange.'],q:['Explain the problems of water scarcity in India.','Describe any three methods of water conservation.'],t:'Give causes, effects and solutions in separate parts, and add one example of rainwater harvesting.',m:['Water Resources',['Sources',['Surface water','Groundwater']],['Use',['Agriculture','Industry','Domestic']],['Problems',['Scarcity','Groundwater depletion','Pollution']],['Conservation',['Rainwater harvesting','Watershed management','Recycling','Drip irrigation']]]},
'history|Rebels and the Raj':{p:['The Revolt of 1857 began on 10 May at Meerut, where sepoys rose against their officers and marched to Delhi. They proclaimed the Mughal emperor Bahadur Shah Zafar as their leader.','Causes: annexation of Awadh (1856) and the Doctrine of Lapse, heavy land revenue, loss of power by landlords and taluqdars, fear for religion, and the greased cartridges of the Enfield rifle.','Leaders: Nana Sahib (Kanpur), Rani Lakshmibai (Jhansi), Begum Hazrat Mahal (Lucknow), Kunwar Singh (Bihar), Maulvi Ahmadullah Shah (Faizabad).','The British recaptured Delhi in September 1857 and suppressed the revolt in 1858.','After it, the Government of India Act 1858 transferred power from the East India Company to the Crown. The Queen’s Proclamation promised respect for religion and no more annexation.','Sources: official British accounts, letters, diaries and pictures. Rebel voices are scarce, so use all sources with care.'],q:['What were the causes of the revolt of 1857?','How did the British respond to the revolt?'],t:'Separate political, economic, military and religious causes, and name the leaders with their regions.',m:['Rebels and the Raj',['Beginning',['Meerut 10 May 1857','Delhi, Bahadur Shah']],['Causes',['Doctrine of Lapse','Awadh annexation','Revenue','Greased cartridges']],['Leaders',['Nana Sahib','Rani Lakshmibai','Begum Hazrat Mahal','Kunwar Singh']],['Aftermath',['Crown rule 1858','Queen’s Proclamation','Suppression']]]},
'history|Thinkers, Beliefs and Buildings':{p:['The middle of the first millennium BCE was a time of new thinking: the Upanishads, Buddha, Mahavira and others questioned rituals and sacrifice.','Buddha taught the four noble truths and the middle path. Suffering has causes, and can be ended by right living. Buddhism spread through the Sangha. Jainism stressed ahimsa and the idea that all beings have souls.','Stupas hold relics of the Buddha. Sanchi has a hemispherical dome (anda), a harmika (railing on top), a yashti (mast) and a chhatri. The Begum of Bhopal, Shahjehan Begum, funded its conservation.','Sculpture at Sanchi depicts jataka stories and symbols like the wheel and the lotus instead of showing the Buddha in human form in early times.','Later developments: Mahayana Buddhism, Bhakti, and Puranic Hinduism with temples such as Deogarh. Rock-cut caves and temples show changes in architecture.'],q:['Describe the structure of the stupa at Sanchi.','What were the teachings of the Buddha?'],t:'Draw a simple stupa diagram with labels. Use sculpture as evidence for beliefs.',m:['Thinkers, Beliefs and Buildings',['New thinkers',['Buddha','Mahavira','Upanishads']],['Teachings',['Four noble truths','Middle path','Ahimsa']],['Stupa',['Anda','Harmika','Yashti','Chhatri']],['Later',['Mahayana','Bhakti','Temples']]]},
'economics|Indian Economy on the Eve of Independence':{p:['Colonial rule aimed at British interests. India became an exporter of raw materials and an importer of finished goods, so the colonial economy stagnated.','Agriculture: low productivity, a zamindari system with high rents, and commercialisation without investment. Industry: decline of handicrafts and few modern industries.','Foreign trade was controlled by Britain. India’s surplus income went abroad as the drain of wealth.','Demography around 1947: birth rate about 48 and death rate about 40 per thousand, infant mortality about 218 per thousand, life expectancy about 32 years and literacy about 16 per cent.','Railways, ports and posts were built mostly to serve British trade and administration, not Indian development.','Occupational structure: about 70 to 75 per cent of people worked in agriculture.'],q:['Explain the impact of colonial rule on Indian agriculture.','What was the drain of wealth?'],t:'Give causes and effects separately, and quote the demographic figures.',m:['Economy at Independence',['Agriculture',['Low productivity','Zamindari','Commercialisation']],['Industry',['Handicraft decline','Few modern industries']],['Trade',['Raw material exports','Finished imports','Drain of wealth']],['Social',['Low life expectancy','Low literacy','High infant mortality']]]},
'economics|Liberalisation, Privatisation and Globalisation':{p:['In 1991 India faced a balance of payments crisis: forex reserves could cover only about two weeks of imports. The Gulf War, high fiscal deficit and rising prices made it worse.','The government introduced the New Economic Policy: stabilisation measures and structural reforms.','Liberalisation: ending industrial licensing, financial sector and tax reforms, and trade and foreign exchange reforms (lower import duties, devaluation of the rupee).','Privatisation: reducing the role of the public sector through disinvestment and allowing private firms into many areas.','Globalisation: integrating India with the world economy through FDI, outsourcing and joining the WTO in 1995.','Impact: higher GDP growth and services expansion, but weaker agriculture and industry growth, limited jobs, and rising inequality.'],q:['What led to the 1991 reforms?','Explain liberalisation, privatisation and globalisation with examples.'],t:'Write the crisis first, then the three parts of reform with one example each, then a balanced evaluation.',m:['LPG Reforms',['Crisis 1991',['Low forex','Fiscal deficit','Gulf War']],['Liberalisation',['No licensing','Trade reforms','Rupee devaluation']],['Privatisation',['Disinvestment','Private entry']],['Globalisation',['FDI','Outsourcing','WTO 1995']]]},
'english|Keeping Quiet':{p:['Poet: Pablo Neruda. He asks everyone to count up to twelve and stay still together, for a moment of silence.','Keeping quiet does not mean death or inactivity. He wants us to stop speaking different languages, stop moving our arms and think about ourselves.','He asks fishermen to stop harming whales, and salt gatherers to look at their hurt hands. He also asks people not to wage wars with gas and fire, which leave no survivors.','The earth can teach us: life seems dead in winter but is alive underneath. Stillness brings introspection and peace.','Themes: peace, brotherhood, introspection and a plea against war and exploitation of nature.'],q:['What is the poet asking us to do, and why?','What does the poet mean by keeping quiet not being death?'],t:'State what keeping quiet is NOT (not death, not inaction), then give the benefits: peace and self-understanding.',m:['Keeping Quiet',['Request',['Count to twelve','Stay still','Stop talking']],['Appeals',['Fishermen and whales','Salt gatherers','No wars']],['Idea',['Not death','Introspection','Learn from earth']],['Themes',['Peace','Brotherhood','Nature']]]},
'english|The Tiger King':{p:['Author: Kalki. The Maharaja of Pratibandapuram is told by an astrologer that he was born to die by a tiger. He becomes a ruthless hunter to defy the prophecy.','He bans tiger hunting by anyone else, punishes officials, and dismisses a Dewan who tells the truth about the shortage of tigers. By killing tigers he reaches 99.','To get his 100th tiger, his men even bring a tiger but he misses, and it dies of fright. He thinks he has killed it.','Later, on his son’s birthday, he buys a wooden toy tiger. A sliver from it pierces his hand, the wound gets infected, and he dies. The prophecy comes true in an ironic way.','Satire: of the arrogance of kings, flattery of officers and the foolish belief in fate and power.'],q:['How is The Tiger King a satire?','What is ironic about the Maharaja’s death?'],t:'Identify the satire in three targets: the king’s vanity, the flatterers and the British officials.',m:['The Tiger King',['Prophecy',['Death by a tiger','Born to die from a tiger']],['Hunting',['99 tigers','Banned others','Tiger shortage']],['Irony',['Missed 100th tiger','Wooden toy tiger','Sliver and infection']],['Satire',['Royal pride','Flattery','Fate']]]},
'maths|Continuity and Differentiability':{p:['f is continuous at x = a if the left limit = right limit = f(a). Check all three parts for piecewise functions.','If f is differentiable at a, it is continuous at a. The converse is false, e.g. |x| at 0.','Chain rule: dy/dx = (dy/du)(du/dx). Implicit differentiation: differentiate both sides, treat y as a function of x. Logarithmic differentiation helps with y = x^x or y = (f(x))^g(x).','Derivatives of inverse trigonometric functions are standard: d/dx(sin^-1 x) = 1/sqrt(1-x^2), d/dx(tan^-1 x) = 1/(1+x^2).','Parametric form: dy/dx = (dy/dt)/(dx/dt). Second order derivative d2y/dx2 is found by differentiating dy/dx again.','Rolle’s theorem and Mean Value Theorem apply when f is continuous on [a, b] and differentiable on (a, b).'],q:['Find the value of k so that a piecewise function is continuous.','Differentiate x^x or find dy/dx for parametric equations.'],t:'Always write LHL, RHL and f(a) separately when checking continuity.',m:['Continuity and Differentiability',['Continuity',['LHL = RHL = f(a)','Piecewise functions']],['Differentiability',['Implies continuity','|x| at 0 is not differentiable']],['Techniques',['Chain rule','Implicit','Logarithmic','Parametric']],['Theorems',['Rolle’s theorem','Mean Value Theorem']]]},
'maths|Differential Equations':{p:['Order is the highest derivative present. Degree is the power of the highest derivative when it is a polynomial in the derivatives.','General solution has as many arbitrary constants as the order. A particular solution has specific values of the constants.','To form a differential equation, differentiate as many times as there are arbitrary constants, then eliminate them.','Variable separable: dy/dx = f(x)g(y) so write dy/g(y) = f(x)dx and integrate both sides.','Homogeneous: dy/dx = F(y/x). Substitute y = vx, so dy/dx = v + x dv/dx.','Linear first order: dy/dx + Py = Q. Integrating factor IF = e^(integral of P dx), solution y(IF) = integral of Q(IF) dx + C.'],q:['Solve a homogeneous differential equation.','Solve a linear differential equation with its integrating factor.'],t:'Identify the type first (separable, homogeneous or linear) and write the method before the steps.',m:['Differential Equations',['Basics',['Order','Degree','General and particular solution']],['Forming',['Differentiate','Eliminate constants']],['Methods',['Variable separable','Homogeneous: y = vx','Linear: integrating factor']],['Linear form',['dy/dx + Py = Q','IF = e^integral P dx']]]},
'geography|Secondary Activities':{p:['Secondary activities change raw material into finished products of higher value. Manufacturing is the main one. Workers are called blue-collar workers.','Classification by size: household or cottage, small scale, and large scale (heavy and light industries).','Classification by input: agro-based, mineral-based, chemical-based, forest-based and animal-based industries.','Classification by ownership: public sector, private sector and joint sector.','Location factors: market, raw materials, labour, source of power, transport and communication, government policy, and agglomeration economies.','Examples of industrial regions: the Ruhr region and Pittsburgh for iron and steel, and Jamshedpur in India.'],q:['What factors influence the location of industries?','Classify industries on the basis of ownership and give examples.'],t:'Present classifications as a table. It saves time and earns more marks.',m:['Secondary Activities',['By size',['Cottage','Small scale','Large scale']],['By input',['Agro-based','Mineral-based','Chemical-based','Forest-based']],['By ownership',['Public','Private','Joint']],['Location factors',['Market','Raw material','Labour','Power','Transport']]]},
'geography|International Trade':{p:['International trade is the exchange of goods and services between countries. It is the basis of the global economy.','Trade is based on differences in national resources, population, stage of economic development, size and foreign investment, and transport.','Bilateral trade is between two countries; multilateral is among many. Balance of trade: favourable when exports exceed imports, unfavourable when imports exceed exports.','The WTO, set up in 1995 as the successor to GATT, promotes free trade. Regional blocs include the EU and ASEAN.','Ports act as gateways of trade. Advantages: more resources and jobs. Disadvantages: dependence, unequal gains and risk to local industries.'],q:['What are the bases of international trade?','Explain the role of the WTO.'],t:'Define balance of trade with both cases, and name two trade blocs with their regions.',m:['International Trade',['Basis',['Resources','Population','Development','Transport']],['Types',['Bilateral','Multilateral']],['Balance of trade',['Favourable','Unfavourable']],['Institutions',['WTO 1995','GATT','EU and ASEAN']]]},
'geography|Human Settlements':{p:['A human settlement is a cluster of dwellings where people live, from a hamlet to a megacity.','Rural settlements: compact or nucleated, and dispersed. Patterns are linear, rectangular, circular, star-like and T-shaped. Urban settlements are larger and based on non-agricultural work.','Urban classification by size: town, city, million city, conurbation and megalopolis. Functions: administrative, trading, cultural, health and industrial towns.','Problems of rural settlements: water supply, sanitation, poor roads and lack of facilities.','Problems of urban settlements: overcrowding, slums, traffic, pollution, unemployment and crime.'],q:['Distinguish between rural and urban settlements.','Describe the patterns of rural settlements.'],t:'Sketch the common rural patterns, since diagrams add marks.',m:['Human Settlements',['Rural',['Compact','Dispersed','Linear, circular, star']],['Urban',['Town and city','Million city','Conurbation','Megalopolis']],['Functions',['Administrative','Trading','Cultural','Health']],['Problems',['Water and sanitation','Slums','Pollution','Traffic']]]},
'history|Bhakti–Sufi Traditions':{p:['Bhakti: devotion to a god. Saguna (with form) like Rama or Krishna, and nirguna (formless) like Kabir.','In the Tamil region the Alvars (Vishnu) and Nayanars (Shiva) composed hymns. Basavanna led the Virashaiva movement in Karnataka.','Kabir, Guru Nanak and Mirabai: Kabir rejected rituals and caste, Nanak founded the Sikh faith and Kartarpur, Mirabai worshipped Krishna.','Sufism: mystics who stressed love and devotion. They organised khanqahs and silsilas. Chishti saints include Muinuddin Chishti (Ajmer) and Nizamuddin Auliya (Delhi). Practices: sama (music) and ziyarat (pilgrimage).','Sources: poems like the Kabir Granthavali and the Adi Granth, and hagiographies and Sufi texts. They show the exchange between Hindu and Muslim traditions.'],q:['What were the main teachings of Kabir and Guru Nanak?','Describe the features of Sufism.'],t:'Mention region, saint, and teaching in each answer. Avoid mixing Bhakti and Sufi features.',m:['Bhakti–Sufi Traditions',['Bhakti',['Saguna','Nirguna','Alvars and Nayanars']],['Saints',['Kabir','Guru Nanak','Mirabai','Basavanna']],['Sufism',['Khanqah','Silsilas','Chishti','Sama and ziyarat']],['Sources',['Kabir Granthavali','Adi Granth','Sufi texts']]]},
'history|Kinship, Caste and Class':{p:['The Mahabharata is studied through the critical edition prepared by V. S. Sukthankar and a team at the Bhandarkar Oriental Research Institute (1919-1966).','Kinship: the epic shows patrilineal succession and marriage rules, such as endogamy and exogamy. Eight forms of marriage were recognised in the texts.','Varna: the Dharmasutras and Dharmashastras describe four varnas. Brahmanas were supposed to study and teach, kshatriyas to rule and fight. Outside this order were people treated as untouchable.','Examples in the epic include Ekalavya and Karna, which show social boundaries. Draupadi’s polyandrous marriage is another feature.','Historians infer that the epic grew over about a thousand years, so it is a mix of different periods.'],q:['How do the sources show the rules of marriage?','What does the Mahabharata tell us about social inequality?'],t:'Remember: the text grew over centuries, so say it reflects ideals and not just facts.',m:['Kinship, Caste and Class',['Source',['Mahabharata','Critical edition','Sukthankar']],['Kinship',['Patriliny','Endogamy','Exogamy','Eight marriage forms']],['Varna',['Four varnas','Dharmasutras','Untouchables']],['Cases',['Ekalavya','Karna','Draupadi']]]},
'economics|Determination of Income and Employment':{p:['Aggregate demand AD = C + I (two sector). Consumption function C = a + cY, where c is the marginal propensity to consume (MPC).','APC = C/Y, MPC = change in C / change in Y. MPC + MPS = 1, and APC + APS = 1.','Equilibrium income is where AD = AS (Y = C + I), or equivalently saving = investment.','Investment multiplier k = 1/(1 - MPC) = 1/MPS. A rise in investment raises income by k times.','Full employment means no involuntary unemployment. Excess demand (inflationary gap) and deficient demand (deflationary gap) are corrected by fiscal and monetary policy.'],q:['Explain the multiplier with an example.','Distinguish between inflationary and deflationary gaps.'],t:'Do numericals in steps: write the formula, substitute, and state the unit. Learn the multiplier formula.',m:['Income and Employment',['Consumption',['C = a + cY','MPC, APC','MPC + MPS = 1']],['Equilibrium',['AD = AS','S = I']],['Multiplier',['1/(1-MPC)','1/MPS']],['Gaps',['Inflationary gap','Deflationary gap','Policy remedies']]]},
'economics|Human Capital Formation':{p:['Human capital is the stock of skills and productive knowledge in people. Human capital formation is the process of building it up.','Sources: education, health, on-the-job training, migration and information. Education improves skills, and health improves work capacity.','Physical capital can be sold and moved, while human capital belongs to the person. Human capital also gives social benefits, like lower crime and better health.','Problems: low public expenditure on education and health, school dropouts, brain drain, rising costs of higher education.','Human capital leads to higher productivity, growth and human development.'],q:['What is human capital formation and what are its sources?','Distinguish between human capital and physical capital.'],t:'Always list all five sources and link human capital to growth and human development.',m:['Human Capital Formation',['Meaning',['Skills and knowledge','Stock vs formation']],['Sources',['Education','Health','On-the-job training','Migration','Information']],['Benefits',['Productivity','Growth','Human development']],['Problems',['Low spending','Dropouts','Brain drain']]]},
'english|Aunt Jennifer’s Tigers':{p:['Poet: Adrienne Rich. Aunt Jennifer embroiders tigers on a panel. The tigers are bold, graceful and fearless, and they walk without fear of men beneath the trees.','Aunt Jennifer is old and weak. Her fingers flutter and the wedding band is a heavy weight, a symbol of her oppressive marriage dominated by her husband.','After she dies, her terrified hands will lie still, but the tigers she created will go on prancing.','Tigers symbolise freedom, courage and the strength she lacks. Her art is an escape from her suffering.','Themes: women’s oppression in marriage, the power of creativity, and a contrast between the aunt and the tigers.'],q:['What do the tigers symbolise?','How does the poet show the aunt’s suffering?'],t:'Draw the contrast between the fearless tigers and the frightened aunt, and mention the wedding band as a symbol.',m:['Aunt Jennifer’s Tigers',['Tigers',['Fearless','Prancing','Freedom']],['Aunt Jennifer',['Old and weak','Fluttering fingers','Heavy wedding band']],['Contrast',['Bold vs terrified','Free vs bound']],['Themes',['Women’s oppression','Art as escape']]]},
'english|A Thing of Beauty':{p:['Poet: John Keats. A thing of beauty is a joy for ever. Its loveliness increases and never fades into nothingness.','It keeps for us a peaceful bower, and gives us sleep full of sweet dreams, health and quiet breathing.','Every morning we make a flowery band to bind us to the earth, in spite of gloom, lack of noble people, and dark, unhealthy ways.','Beauty exists in the sun, moon, trees, daffodils, clear streams and the forest’s musk-rose blooms, and in tales of the mighty dead.','These beautiful things are an endless fountain of immortal drink, pouring from heaven. Themes: nature, beauty and hope.'],q:['What are the things that cause suffering and the things that remove it?','Why does the poet call beauty a joy for ever?'],t:'Divide your answer into sufferings, beautiful things and their effect. Explain the figure of the flowery band.',m:['A Thing of Beauty',['Idea',['Joy for ever','Never fades','Peace and health']],['Sufferings',['Gloomy days','Lack of noble people','Dark ways']],['Beauty',['Sun and moon','Trees and daffodils','Stories of heroes']],['Effect',['Binds us to earth','Fountain of joy']]]},
'maths|Inverse Trigonometric Functions':{p:['Principal value branches: sin^-1 is [-pi/2, pi/2]; cos^-1 is [0, pi]; tan^-1 is (-pi/2, pi/2); cot^-1 is (0, pi); sec^-1 is [0, pi] except pi/2; cosec^-1 is [-pi/2, pi/2] except 0.','Always give the answer in the principal value range.','Properties: sin^-1(-x) = -sin^-1 x; cos^-1(-x) = pi - cos^-1 x; tan^-1(-x) = -tan^-1 x.','sin^-1 x + cos^-1 x = pi/2 and tan^-1 x + cot^-1 x = pi/2.','tan^-1 x + tan^-1 y = tan^-1((x+y)/(1-xy)) if xy < 1. Also 2tan^-1 x = sin^-1(2x/(1+x^2)) = tan^-1(2x/(1-x^2)) with suitable ranges.'],q:['Find the principal value of an inverse trigonometric expression.','Prove an identity involving tan^-1.'],t:'Check the range before applying the formula. A correct formula with a wrong range loses marks.',m:['Inverse Trigonometric Functions',['Principal values',['sin^-1: -pi/2 to pi/2','cos^-1: 0 to pi','tan^-1: -pi/2 to pi/2']],['Properties',['sin^-1(-x)','cos^-1(-x)','tan^-1(-x)']],['Identities',['sin^-1 x + cos^-1 x = pi/2','tan^-1 x + cot^-1 x = pi/2']],['Sum formula',['tan^-1 x + tan^-1 y','Condition xy < 1']]]},
'maths|Vector Algebra':{p:['Magnitude of a = ai + bj + ck is sqrt(a^2 + b^2 + c^2). Unit vector = vector / magnitude. Direction cosines l, m, n satisfy l^2 + m^2 + n^2 = 1.','Position vector of a point dividing AB in ratio m:n internally is (m b + n a)/(m + n). Midpoint = (a + b)/2.','Dot product: a.b = |a||b| cos(theta). It is zero when the vectors are perpendicular. Projection of a on b = a.b/|b|.','Cross product: |a x b| = |a||b| sin(theta), giving a vector perpendicular to both. It is zero when the vectors are parallel.','Area of a parallelogram = |a x b|. Area of a triangle = (1/2)|a x b|.'],q:['Find the angle between two vectors.','Find the area of a triangle with given vertices.'],t:'Write the formula, substitute, and compute the magnitude as a separate step to avoid arithmetic mistakes.',m:['Vector Algebra',['Basics',['Magnitude','Unit vector','Direction cosines']],['Dot product',['|a||b|cos(theta)','Perpendicular: 0','Projection']],['Cross product',['|a||b|sin(theta)','Parallel: 0','Area of parallelogram']],['Points',['Section formula','Midpoint']]]},
'geography|Land Resources and Agriculture':{p:['Land use categories: forests, area not available for cultivation, other uncultivated land, fallow land, and net sown area. Gross cropped area counts a field once for each crop.','Cropping seasons: Kharif (June to September; rice, maize, cotton, jowar, bajra), Rabi (October to March; wheat, barley, gram, mustard) and Zaid (summer; watermelon, vegetables, fodder).','Major crops: rice, wheat, millets, pulses, sugarcane, cotton and jute, oilseeds, tea and coffee.','The Green Revolution used high-yielding seeds, fertiliser and irrigation, mainly in Punjab, Haryana and western UP.','Problems: small holdings, dependence on monsoon, soil erosion and salinity, and low productivity.'],q:['Explain the cropping seasons of India.','Discuss the problems of Indian agriculture.'],t:'Put crops, seasons and states in a three-column table. It makes revision quick.',m:['Land Resources and Agriculture',['Land use',['Net sown area','Forest','Fallow land']],['Seasons',['Kharif','Rabi','Zaid']],['Crops',['Rice and wheat','Cotton and jute','Tea and coffee']],['Problems',['Monsoon dependence','Small holdings','Soil degradation']]]},
'geography|Population of India':{p:['The Census 2011 recorded a population of about 1.21 billion, nearly 17.5 per cent of the world. Uttar Pradesh is the most populous state.','Density was about 382 persons per sq km; Bihar was highest among major states and Arunachal Pradesh lowest.','Literacy was about 74 per cent. The sex ratio was 943 females per 1000 males. Check the latest census figures for updates.','Growth: the decadal growth rate fell from the 1991 to 2011 period. Population grows due to high birth rate and falling death rate.','Age composition: children (0-14), working age (15-59) and aged (60+). A large working population is a demographic advantage.'],q:['Explain the distribution and density of India’s population.','What are the causes of rapid population growth?'],t:'Use figures with the census year. Use a table for the population factors.',m:['Population of India',['Size',['1.21 billion','17.5% of world','UP is largest']],['Density',['382 per sq km','Bihar highest']],['Social',['Literacy 74%','Sex ratio 943']],['Age',['0-14','15-59','60+']]]},
'geography|Transport and Communication':{p:['Transport carries goods and people: land (roads, railways), water, air and pipelines. Communication includes newspapers, radio, television, satellite and the internet.','Roads are flexible and good for short distances. Railways suit heavy goods over long distances. The Trans-Siberian Railway links Moscow with Vladivostok.','Water transport is the cheapest for bulk goods. Suez Canal (1869) and Panama Canal (1914) shorten sea routes.','Air transport is the fastest but the most expensive. Pipelines move oil, gas and water.','Satellite communication and the internet have created a global network.'],q:['Compare roadways and railways.','Why are the Suez and Panama canals important?'],t:'Make a table: mode, advantage, limitation, example.',m:['Transport and Communication',['Land',['Roads','Railways','Trans-Siberian']],['Water',['Cheap','Suez Canal','Panama Canal']],['Air and pipeline',['Fastest','Oil and gas pipelines']],['Communication',['Satellite','Internet','Newspapers']]]},
'history|Kings, Farmers and Towns':{p:['Around 600 BCE there were sixteen mahajanapadas; Magadha became the most powerful, with capitals at Rajagriha and later Pataliputra.','The Mauryan empire was founded by Chandragupta in about 321 BCE. Ashoka (c. 268 to 232 BCE) spread his Dhamma through inscriptions.','James Prinsep deciphered Brahmi and Kharosthi in the 1830s, which let historians read Ashoka’s inscriptions.','Sources: the Arthashastra, Megasthenes’ Indica, inscriptions and punch-marked coins.','Agriculture: use of iron ploughshare and irrigation increased production. Towns such as Mathura and Taxila grew with trade and crafts. Guilds supported trade.'],q:['What was Ashoka’s Dhamma?','How did historians decipher Ashoka’s inscriptions?'],t:'Separate the sources into inscriptions, literature and coins, and say what each tells us.',m:['Kings, Farmers and Towns',['Early states',['16 mahajanapadas','Magadha','Pataliputra']],['Mauryas',['Chandragupta','Ashoka','Dhamma']],['Sources',['Inscriptions','Arthashastra','Indica','Coins']],['Economy',['Iron ploughshare','Towns','Guilds']]]},
'history|Peasants, Zamindars and the State':{p:['In Mughal India most people lived in villages. Peasants were khud-kashta (resident) or pahi-kashta (non-resident). Village panchayats and jati panchayats regulated social life.','Crops: food crops such as rice, wheat and millets, and cash crops (jins-i-kamil) such as cotton and sugarcane. New crops such as tobacco and maize came from the Americas.','Zamindars collected revenue and held lands, forts and armed retainers. They were an intermediate class.','Akbar’s revenue system, the zabt, was developed with Todar Mal. Land was measured and taxed in cash.','The Ain-i-Akbari by Abul Fazl is the main source. It records revenue, population and administration. It reflects the viewpoint of the state.'],q:['Describe the role of zamindars in Mughal India.','What does the Ain-i-Akbari tell us about agrarian society?'],t:'Remember that the Ain-i-Akbari is an official source, so mention its limits.',m:['Peasants, Zamindars and the State',['Peasants',['Khud-kashta','Pahi-kashta','Panchayats']],['Crops',['Rice and wheat','Cotton and sugarcane','Tobacco and maize']],['Zamindars',['Collected revenue','Armed retainers']],['State',['Zabt system','Todar Mal','Ain-i-Akbari']]]},
'economics|Employment':{p:['A worker is anyone engaged in economic activity. Worker-population ratio = (workers / population) x 100.','Types of employment: self-employed, regular salaried and casual wage labour. Sectors: primary, secondary and tertiary. Formal sector workers get protection; informal sector workers do not.','Unemployment types: open, seasonal and disguised. Causes: slow growth, population, low skills and dependence on agriculture.','Trends: jobless growth, casualisation and informalisation of work, with women taking part less often in paid work.','Government efforts: MGNREGA, skill development and self-employment schemes.'],q:['Distinguish between formal and informal sectors.','What is jobless growth?'],t:'Define terms with a formula or example, and give two points for each cause or remedy.',m:['Employment',['Workers',['Self-employed','Regular salaried','Casual wage']],['Sectors',['Primary','Secondary','Tertiary','Formal and informal']],['Unemployment',['Open','Seasonal','Disguised']],['Remedies',['MGNREGA','Skill development','Self-employment']]]},
'economics|Indian Economy 1950–1990':{p:['After independence India chose a mixed economy and planning. The Planning Commission was set up in 1950, and Five Year Plans began in 1951.','Goals: growth, modernisation, self-reliance and equity.','Agriculture: land reforms (abolishing intermediaries, tenancy reform, ceilings, consolidation) and the Green Revolution from the 1960s using HYV seeds.','Industry: the Industrial Policy Resolution 1956 gave the public sector a major role, with licensing and reservation for small-scale industries.','Trade: import substitution and protection of domestic industry. Limits: inefficiency, licensing delays and slow growth.'],q:['Explain the goals of Five Year Plans.','Why was the public sector given an important role?'],t:'Link each goal to a policy: for example, self-reliance and import substitution.',m:['Economy 1950-1990',['Planning',['Planning Commission 1950','Five Year Plans']],['Goals',['Growth','Modernisation','Self-reliance','Equity']],['Agriculture',['Land reforms','Green Revolution']],['Industry and trade',['IPR 1956','Licensing','Import substitution']]]},
'english|The Third Level':{p:['Author: Jack Finney. Charley, the narrator, walks through Grand Central Station and finds a third level that does not exist for others. It leads him to the year 1894, with old gas lights, a small station and old-fashioned people.','He tries to buy tickets to Galesburg, Illinois, the home of his wife’s family, but his modern money is not accepted, as the old currency was different in size.','His psychiatrist friend Sam says it is a form of escapism, a wish to run away from the stress of the present. Charley collects stamps and this adds to the story.','Later he finds a first-day cover addressed to him, dated 1894, from Sam, who has moved to Galesburg. It suggests the third level is real.','Themes: escape from a stressful modern life, the pull of the past, the border between fantasy and reality.'],q:['Why does Charley believe the third level exists?','What did the psychiatrist say about the third level?'],t:'Use both views: the escapist explanation and the evidence from the letter, and conclude it is open to interpretation.',m:['The Third Level',['Place',['Grand Central Station','Third level','Year 1894']],['Evidence',['Old currency','Gas lights','Letter from Sam']],['Explanation',['Escapism','Sam the psychiatrist']],['Themes',['Stress of life','Longing for the past','Fantasy vs reality']]]},
'english|A Roadside Stand':{p:['Poet: Robert Frost. Poor farmers have built a small roadside stand to sell their produce to passing motorists, hoping for money and a better life.','The rich city people drive past in polished cars, often without stopping, or stop only to ask for directions. The poet shows their indifference.','The poet feels deep sympathy for the farmers and their hopes. He also criticises the city folk and the government, who offer only promises.','The farmers dream of a way to escape poverty, but the town does not help them. Their fate is sad.','Themes: rural poverty, the gap between rich and poor, and false promises of progress. Devices: irony and simple language.'],q:['What is the plight of the people at the roadside stand?','How does the poet criticise the rich?'],t:'Contrast the farmers’ hope with the passers-by’s indifference, and mention the poet’s sympathy.',m:['A Roadside Stand',['Farmers',['Small stand','Poor and hopeful','Sell produce']],['City people',['Drive past','Indifferent','Ask for directions']],['Poet',['Sympathy','Criticises the rich','Wishes real help']],['Themes',['Poverty','Inequality','Broken hopes']]]},
'maths|Application of Integrals':{p:['Area under y = f(x) from x = a to x = b is the integral of y dx from a to b. Area under x = g(y) between y = c and y = d is the integral of x dy.','Area between two curves y = f(x) and y = g(x) from a to b is the integral of (f(x) - g(x)) dx, where f is the upper curve.','Standard areas: circle x^2 + y^2 = a^2 has area pi a^2; ellipse x^2/a^2 + y^2/b^2 = 1 has area pi a b.','Steps: draw a rough sketch, find the points of intersection, choose vertical or horizontal strips, set up the integral and evaluate.','If the region lies below the x-axis, take the absolute value; use symmetry to halve the work.'],q:['Find the area bounded by a parabola and a line.','Find the area of a circle or ellipse using integration.'],t:'Always draw the sketch and shade the region. It earns marks even before the calculation.',m:['Application of Integrals',['Area under curve',['y dx between a and b','x dy for y-axis']],['Between curves',['Upper minus lower','Find intersections']],['Standard',['Circle: pi a^2','Ellipse: pi a b']],['Steps',['Sketch','Strips','Integrate']]]},
'maths|Three Dimensional Geometry':{p:['Direction cosines l, m, n of a line satisfy l^2 + m^2 + n^2 = 1. Direction ratios a, b, c are proportional to them: l = a/sqrt(a^2 + b^2 + c^2).','Vector form of a line: r = a + t b. Cartesian form: (x - x1)/a = (y - y1)/b = (z - z1)/c.','Angle between two lines: cos(theta) = |a1 a2 + b1 b2 + c1 c2| / (sqrt(a1^2 + b1^2 + c1^2) sqrt(a2^2 + b2^2 + c2^2)). Lines are perpendicular if the numerator is zero.','Shortest distance between skew lines r = a1 + t b1 and r = a2 + s b2 is |(b1 x b2) . (a2 - a1)| / |b1 x b2|.','Distance between parallel lines: |b x (a2 - a1)| / |b|. Check which topics your syllabus includes, such as planes.'],q:['Find the shortest distance between two skew lines.','Find the angle between two lines given in Cartesian form.'],t:'Convert lines to vector form first, then apply the formula step by step.',m:['Three Dimensional Geometry',['Direction',['Cosines: l, m, n','Ratios: a, b, c']],['Line',['Vector form','Cartesian form']],['Angle',['Using direction ratios','Perpendicular: dot = 0']],['Distance',['Skew lines','Parallel lines']]]},
